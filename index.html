<script>
// =====================================================================
//  Biglers Biler – etape 3  (v0.27.1)
//  Enarmet tyveknægt (chassis/hjul/motor/værktøj), bakket terræn, hop,
//  autokør/fuld styring, forhindringer, skade/røg/sammenbrud, lyd i kode
// =====================================================================
const W = 1280, H = 720;
const FONT = "'Fredoka', 'Arial Black', Arial, sans-serif";   // rund tegneserieskrift, falder tilbage til Arial
const SEG = 48;            // terrænsegmentets bredde i px
const GROUND_Y = 520;      // udgangshøjde for jorden
const PX_PER_M = 50;       // 50 px = 1 meter i scoren
const GRP_CAR = -100000, GRP_PIECE = -100001;   // egne grupper, langt fra dem motoren selv uddeler (-1, -2, ...)

// Alle dele har parametre, så etape 3 bare udfylder dem pr. del.
let VEHICLE = {   // sættes ud fra de valgte dele i Game.create (vehicleFromBuild)
  chassis: { w: 170, h: 48, density: 0.003, topH: 80 },
  wheel:   { r: 30, back: -58, front: 58, oy: 22, density: 0.004, grip: 1.0 },
  motor:   { power: 0.33, pitch: 1.0, accel: 0.15 },
  tool: null, mass: 45, jump: 12
};

// ---------- gemte indstillinger ----------
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const SETTINGS = {
  auto:  lsGet('fk_auto', '1') !== '0',
  muted: lsGet('fk_muted', '0') === '1',   // effekter (motor, bump, dyr …) slået fra
  musicOff: lsGet('fk_music', lsGet('fk_muted', '0')) === '1',   // musikken slået fra (første gang: som den gamle fælles knap)
  best:  parseFloat(lsGet('fk_best', '0')) || 0,
  lite:  false   // let tilstand – sættes automatisk i denne session, hvis enheden hakker
};
function saveSettings() {
  lsSet('fk_auto', SETTINGS.auto ? '1' : '0');
  lsSet('fk_muted', SETTINGS.muted ? '1' : '0');
  lsSet('fk_music', SETTINGS.musicOff ? '1' : '0');
  lsSet('fk_best', String(SETTINGS.best));
}

// ---------- lyd (alt i kode) ----------
const SFX = {
  ctx: null, master: null, eng: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { this.ctx = new AC(); }
    this.master = this.ctx.createGain();
    this.master.gain.value = SETTINGS.muted ? 0 : 1;
    this.master.connect(this.ctx.destination);
    this.musBus = this.ctx.createGain(); this.musBus.gain.value = SETTINGS.musicOff ? 0 : 1; this.musBus.connect(this.ctx.destination);   // musikken har sin egen knap
  },
  setMusicOff(m) { if (this.musBus) this.musBus.gain.setTargetAtTime(m ? 0 : 1, this.ctx.currentTime, 0.05); },
  setMuted(m) { if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 1, this.ctx.currentTime, 0.02); },
  startEngine() {
    if (!this.ctx || this.eng) return;
    const c = this.ctx;
    const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 50;
    const o2 = c.createOscillator(); o2.type = 'square';   o2.frequency.value = 25;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200;
    const g = c.createGain(); g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o1.start(); o2.start();
    this.eng = { o1, o2, f, g };
  },
  engine(speed, on) {           // speed 0..1
    if (!this.eng) return;
    const t = this.ctx.currentTime;
    const base = (30 + speed * 70 + (on ? 10 : 0)) * VEHICLE.motor.pitch;
    this.eng.o1.frequency.setTargetAtTime(base, t, 0.06);
    this.eng.o2.frequency.setTargetAtTime(base / 2, t, 0.06);
    this.eng.f.frequency.setTargetAtTime((160 + speed * 300) * VEHICLE.motor.pitch, t, 0.06);
    this.eng.g.gain.setTargetAtTime(on ? 0.09 : 0.04, t, 0.1);
  },
  stopEngine() {
    if (!this.eng) return;
    const e = this.eng; this.eng = null;
    e.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
    setTimeout(() => { try { e.o1.stop(); e.o2.stop(); } catch (x) {} }, 500);
  },
  blip(f0, f1, dur, type, vol) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, cutoff) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  jump()  { this.blip(300, 800, 0.18, 'sine', 0.25); },
  land(i) { this.noise(0.11, Math.min(0.5, 0.12 + i * 0.08), 160 + i * 40); this.blip(70, 35, 0.12, 'sine', Math.min(0.5, 0.15 + i * 0.08)); },
  crash() { this.noise(0.5, 0.5, 600); this.blip(200, 40, 0.5, 'sawtooth', 0.3); },
  hit(k)  { this.noise(0.15 + k * 0.2, 0.2 + k * 0.4, 300 + k * 900); this.blip(120, 40, 0.15 + k * 0.2, 'sawtooth', 0.15 + k * 0.3); },
  bigCrash() { this.noise(0.9, 0.7, 1200); this.blip(300, 30, 0.9, 'sawtooth', 0.4); setTimeout(() => this.blip(500, 120, 0.4, 'square', 0.2), 250); },
  wood()  { this.noise(0.15, 0.35, 1400); this.blip(320, 110, 0.1, 'square', 0.15); },
  say(k)  {   // væsenernes udbrud
    if (k === 'moo') return this.moo();
    if (k === 'squawk') { this.blip(900, 1400, 0.12, 'square', 0.15); setTimeout(() => this.blip(1100, 1500, 0.1, 'square', 0.12), 140); }
    else if (k === 'bark') { this.blip(260, 180, 0.12, 'sawtooth', 0.22); setTimeout(() => this.blip(280, 170, 0.12, 'sawtooth', 0.2), 160); }
    else if (k === 'hoot') { this.blip(330, 300, 0.25, 'sine', 0.22); setTimeout(() => this.blip(300, 260, 0.35, 'sine', 0.2), 300); }
    else if (k === 'grunt') { this.blip(140, 90, 0.4, 'sawtooth', 0.2); this.noise(0.3, 0.12, 600); }
    else if (k === 'ooh') { [500, 650, 800, 650].forEach((f, i) => setTimeout(() => this.blip(f, f * 1.2, 0.1, 'square', 0.14), i * 110)); }
    else if (k === 'baa') { this.blip(420, 380, 0.5, 'sawtooth', 0.14); }
    else if (k === 'whee') { this.blip(400, 1600, 0.6, 'sine', 0.16); }
    else if (k === 'chime') { [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => this.blip(f, f, 0.25, 'sine', 0.12), i * 90)); }
  },
  bonk()  { this.blip(220, 60, 0.3, 'square', 0.25); this.noise(0.1, 0.3, 900); },
  saw()   { this.noise(0.12, 0.2, 2200); this.blip(900, 700, 0.12, 'sawtooth', 0.08); },
  metal() { this.blip(900, 250, 0.35, 'sawtooth', 0.2); this.noise(0.2, 0.3, 2500); },
  splat() { this.noise(0.25, 0.35, 900); this.blip(420, 110, 0.3, 'sine', 0.3); },
  pop()   { this.blip(1000, 180, 0.07, 'square', 0.3); },
  boing() { this.blip(140, 700, 0.3, 'sine', 0.3); this.blip(280, 1400, 0.3, 'triangle', 0.12); },
  bounce(){ this.blip(220, 440, 0.15, 'sine', 0.25); },
  moo()   { this.blip(230, 150, 0.5, 'sawtooth', 0.22); this.blip(115, 75, 0.5, 'triangle', 0.15); },
  pff()   { this.noise(0.18, 0.2, 500); },
  tick()  { this.blip(1200, 900, 0.03, 'square', 0.06); },
  stop()  { this.blip(500, 250, 0.1, 'square', 0.2); this.noise(0.05, 0.2, 2000); },
  clunk() { this.noise(0.12, 0.35, 500); this.blip(160, 60, 0.15, 'sine', 0.35); },
  pow()   { this.noise(0.1, 0.4, 1500); this.blip(200, 80, 0.12, 'square', 0.3); },
  chomp() { this.noise(0.06, 0.4, 2500); this.blip(500, 120, 0.1, 'square', 0.3); },
  glass() { this.noise(0.25, 0.3, 6000); [2400, 3100, 1900].forEach((f, i) => setTimeout(() => this.blip(f, f * 0.7, 0.12, 'sine', 0.12), i * 40)); },
  crunch(){ this.noise(0.3, 0.45, 900); this.blip(90, 40, 0.3, 'sawtooth', 0.25); },
  rockBreak() { this.noise(0.4, 0.5, 700); this.blip(140, 50, 0.3, 'square', 0.3); },
  porcelain() { this.noise(0.3, 0.4, 4000); this.blip(1500, 500, 0.2, 'triangle', 0.2); },
  whoosh(){ this.noise(0.35, 0.15, 2500); this.blip(300, 900, 0.35, 'sine', 0.08); },
  flush() { this.noise(0.7, 0.3, 1200); [0, 120, 260, 420].forEach((d, i) => setTimeout(() => this.blip(420 - i * 60, 160, 0.18, 'sine', 0.2), d)); },
  click() { this.blip(600, 900, 0.08, 'square', 0.1); },
  ufo()   { [0, 150, 300, 450].forEach(d => setTimeout(() => this.blip(600, 1200, 0.14, 'sine', 0.12), d)); },
  zap()   { this.blip(1800, 200, 0.4, 'sawtooth', 0.2); this.noise(0.3, 0.3, 3000); },
  pfft() { this.noise(0.6, 0.35, 1800); this.blip(900, 120, 0.6, 'sawtooth', 0.1); this.blip(1400, 300, 0.5, 'sine', 0.08); },
  tada()  { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, f, 0.25, 'triangle', 0.25), i * 120)); }
};

function bakeTex(scene, key, x0, y0, w, h, draw, grad) {
  if (scene.textures.exists(key)) return key;

}

function vGrad(ctx, x, y, w, h, c1, a1, c2, a2) {
  const css = (c, a) => 'rgba(' + (c >> 16 & 255) + ',' + (c >> 8 & 255) + ',' + (c & 255) + ',' + a + ')';

function partTextureKey(kind, part) { return 'p_' + kind + '_' + part.id; }

function topRel(ch) { return ch.full ? -ch.topH / 2 : -(ch.h / 2 + ch.topH / 2); }
// fjedrene skal sidde fast på den TEGNEDE bil (ikke på den usynlige fysik-kasse): find nederste synlige pixel lige over hjulet
function texLowest(scene, key, px) {
  if (!scene.textures.exists(key)) return null;
  const src = scene.textures.get(key).getSourceImage(); if (!src || !src.getContext) return null;
  const x0 = Math.max(0, Math.round(px) - 4), x1 = Math.min(src.width, Math.round(px) + 5); if (x1 <= x0) return null;
  const d = src.getContext('2d').getImageData(x0, 0, x1 - x0, src.height).data, w = x1 - x0;
  for (let y = src.height - 1; y >= 0; y--) for (let i = 0; i < w; i++) if (d[(y * w + i) * 4 + 3] > 60) return y + 1;
  return null;
}
// imgs: [{ key, cx, cy, sc }] – billedernes midte (lokale koordinater) og skala; svar: laveste synlige y over x = ox, eller null
function carBottom(scene, imgs, ox) {
  let best = null;
  imgs.forEach(({ key, cx, cy, sc }) => { if (!scene.textures.exists(key)) return; const t = scene.textures.get(key).getSourceImage();
    const y = texLowest(scene, key, (ox - cx) / sc + t.width / 2); if (y !== null) { const ly = cy + (y - t.height / 2) * sc; if (best === null || ly > best) best = ly; } });
  return best;
}
// en fjeder fra bilens underkant ned til hjulets midte (hjulet ligger ovenpå og dækker den nederste del)
function springImg(scene, ch, ox, cy, wheelY) {

  });
}

function wheelGeom(ch, wh) {

  pull() {

    while (picks.length < N) picks.push(Phaser.Utils.Array.GetRandom(list));   // (hvis der er færre dele end vinduer)

      this.tweens.add({ targets: w.strip, y: w.y + 18, duration: 1000 + i * 380, ease: 'Quad.easeOut',

  }
  // "Prøv mig!" fra forsiden: ingen tyveknægt – bilen bygges direkte i værkstedet, del for del
  autoBuild(t) {
    this.busy = true; this.cameras.main.centerOn(W + 640, H / 2);
    const steps = [['chassis', t.chassis], ['wheels', t.wheels], ['motors', t.motors], ['tools', t.tools]].filter(([, p]) => p);
    steps.forEach(([kind, part], k) => this.time.delayedCall(300 + k * 1700, () => {

    }));

  addToPreview(kind, part, from) {

    p.setScale(sc);
    // delen flyver ind fra tyveknægtens vindue (verdenskoordinater -> samlebordets)
    // karrosseri fra tyveknægtens vindue (venstre), hjul fra hver sin side, motor oppefra, værktøj fra højre
    const fx = from ? (from.x - p.x) / sc : -800, fy = from ? (from.y - p.y) / sc : -300;
    const drop = (img, dir) => { const tx = img.x, ty = img.y;
      if (dir === 'left') img.setPosition(tx - 1000 / sc, ty - 60 / sc); else if (dir === 'right') img.setPosition(tx + 1000 / sc, ty - 60 / sc); else if (dir === 'top') img.setPosition(tx, ty - 800 / sc); else img.setPosition(fx, fy);
      img.setScale(img.scaleX * 1.6, img.scaleY * 1.6).setAngle(dir === 'right' ? 25 : -25).setAlpha(0);   // usynlig, til kameraet er fremme i værkstedet
      this.tweens.add({ targets: img, x: tx, y: ty, scaleX: img.scaleX / 1.6, scaleY: img.scaleY / 1.6, angle: 0, delay: 700, duration: 700, ease: 'Quad.easeIn', onStart: () => img.setAlpha(1) }); };
    if (kind === 'chassis') {
      const oy = part.h / 2 - 2, wheelR = 30;   // hjul kendes ikke endnu; bilen står på "ingenting"
      p.body = this.add.image(0, -wheelR - oy, 'p_chassis_' + part.id + '_body'); p.add(p.body);
      p.top = this.add.image(part.topOx || 0, p.body.y + topRel(part), 'p_chassis_' + part.id + '_top'); p.add(p.top);
      if (part.dangle) { p.dangle = this.add.image(part.dangle.ox, p.body.y + part.dangle.oy + part.dangle.h / 2, 'p_chassis_' + part.id + '_dangle'); p.add(p.dangle); drop(p.dangle, 'left'); this.tweens.add({ targets: p.dangle, angle: 8, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.inOut', delay: 1200 });
        if (part.dangle.prop) { p.prop = this.add.image(part.dangle.ox + part.dangle.prop.ox, p.dangle.y + part.dangle.prop.oy, 'p_chassis_' + part.id + '_prop'); p.add(p.prop); drop(p.prop, 'left'); } }
      drop(p.body, 'left'); drop(p.top, 'left');   // karrosseriet kommer ind fra venstre uden for værkstedet
      this.time.delayedCall(1450, () => { if (p.active) addBlinks(this, p, part, part.topOx || 0, p.top.y, 1); });
    } else if (kind === 'wheels') {
      const { oy, cy, xs: wxs } = wheelGeom(ch, part);   // chassis-center så hjulene rører jorden
      const bdy = cy + topRel(ch) - p.top.y; p.list.forEach(o => { if (o.texture && o.texture.key === 'blink') o.y += bdy; });   // blinklysene følger med, når bilen løftes op på hjulene
      p.body.y = cy; p.top.y = cy + topRel(ch); if (p.dangle) p.dangle.y = cy + ch.dangle.oy + ch.dangle.h / 2; if (p.prop) p.prop.y = p.dangle.y + ch.dangle.prop.oy; if (p.tool) p.tool.y = cy + p.tool.toolOy;
      const rs = rearScaleFor(ch, part);
      wxs.forEach((ox, wi) => { const wk = wi === 0 ? rs : 1, wdy = -(wk - 1) * part.r / (ch.scale || 1);
        if (part.spring) { const sp = springImg(this, ch, ox, cy, cy + oy + 50 + wdy); p.add(sp); drop(sp); }
        const w = this.add.image(ox, cy + oy + (part.spring ? 50 : 0) + wdy, 'p_wheels_' + part.id + (part.belt ? '_one' : '')).setScale(wk / (ch.scale || 1)); p.add(w); drop(w, ox < 0 ? 'left' : 'right');
        if (!part.upright) this.tweens.add({ targets: w, angle: 360, duration: 2000, repeat: -1, delay: 1200 }); });
      if (suspFor(ch, part)) {   // monstertruckens affjedring ind til de nye hjul, når de er landet
        const sg = this.add.graphics(); p.addAt(sg, 0); const TW = ch.topW || ch.w, TH = ch.topH + (ch.full ? ch.h : 0), tx = ch.topOx || 0, ty = cy + topRel(ch);
        const wp = wxs.map((ox, wi) => [ox, cy + oy + (part.spring ? 50 : 0) - (wi === 0 ? (rs - 1) * part.r / (ch.scale || 1) : 0)]);
        this.time.delayedCall(1430, () => { drawSusp(sg, ch, (x, y) => [tx + x - TW / 2, ty + y - TH / 2], wp, 1); sg.setAlpha(0); this.tweens.add({ targets: sg, alpha: 1, duration: 200 }); });
      }
      if (part.belt) {   // bæltet tegnes om de to hjul, når de er landet
        const bg = this.add.graphics(); p.addAt(bg, p.list.length - 2);
        const xs = wxs, R = (part.r + 7) / (ch.scale || 1), yy = cy + oy;
        this.time.delayedCall(1430, () => { beltPath(bg, xs[0], yy, xs[1], yy, R, 0); bg.setAlpha(0); this.tweens.add({ targets: bg, alpha: 1, duration: 200 }); });
      }
    } else if (kind === 'motors') {
      const ms = ch.motorScale || 1;
      if (part.rear) { const rp = rearMotorPos(ch, part, this.chosen.wheels); p.motor = this.add.image(rp.x, p.body.y + rp.y, 'rm_' + part.id).setScale(rmS(part)); p.addAt(p.motor, 0); if (rp.bar) { const bi = rearBarImg(this, rp.bar, p.body.y); p.addAt(bi, 0); drop(bi, 'left'); } drop(p.motor, 'left'); }   // jet/raket flyver ind bagfra
      else { const mp = motorPlace(ch, part, this.chosen.wheels); p.motor = this.add.image(-ch.w / 2 + mp.x + 31 * mp.s, p.body.y - ch.h / 2 - ch.topH + mp.y + 11 * mp.s, 'p_motors_' + part.id).setScale(mp.s); p.add(p.motor); drop(p.motor, 'top'); }
    } else if (kind === 'tools') {
      const wh = this.chosen.wheels, mount = toolMount(ch, wh);
      if (mount > ch.w / 2) { const beam = this.add.image((ch.w / 2 + mount) / 2, p.body.y + part.oy, 'slab').setDisplaySize(mount - ch.w / 2 + 12, 10).setTint(0x7f8c8d); p.addAt(beam, 0); drop(beam, 'right'); }
      p.tool = this.add.image(mount + part.w / 2, p.body.y + part.oy, 'p_tools_' + part.id); p.tool.toolOy = part.oy; p.add(p.tool);
      if (part.drawSpin) { const sp = this.add.image(p.tool.x + part.spinAt.x, p.tool.y + part.spinAt.y, 'p_tools_' + part.id + '_spin'); p.add(sp); drop(sp, 'right'); this.tweens.add({ targets: sp, angle: 360, duration: 800, repeat: -1, delay: 1200 }); }
      drop(p.tool, 'right');
    }
  }
}

class Title extends Phaser.Scene {
  constructor() { super('Title'); }
  preload() { if (!this.textures.exists('logo')) this.load.image('logo', LOGO_SRC); }
  create() {
    makeTextures(this); SFX.music('Menu'); endDemo();
    // baggrunden er et tilfældigt af spillets landskaber
    const bio = BIOMES[Phaser.Utils.Array.GetRandom(Object.keys(BIOMES))];
    this.cameras.main.setBackgroundColor(bio.sky);
    if (bio.skyDeco) this.add.tileSprite(0, 0, W, 300, bio.skyDeco).setOrigin(0);
    if (bio.sun) this.add.image(1000, 120, 'sun');
    this.add.tileSprite(0, 0, W, 220, 'clouds').setOrigin(0).setAlpha(bio.night ? 0.35 : 1);
    this.add.tileSprite(0, H - 300, W, 300, bio.far).setOrigin(0).setTint(bio.hills);
    this.add.rectangle(0, H - 66, W, 66, bio.ground).setOrigin(0);
    let mx = 40; while (mx < W + 100) { const def = Phaser.Utils.Array.GetRandom(bio.mid), sc = 0.6 + Math.random() * 0.5; const im = this.add.image(mx, H - 60, def.k).setOrigin(0.5, 1).setScale(sc); if (def.tint) im.setTint(def.tint); mx += 160 + Math.random() * 220; }
    this.add.rectangle(0, H - 60, W, 60, bio.dirt).setOrigin(0);
    this.add.rectangle(0, H - 66, W, 12, bio.grass).setOrigin(0);

    const logo = this.add.image(W / 2, 120, 'logo').setScale(0.5);   // logoet hopper ind og vipper blødt
    this.tweens.add({ targets: logo, scale: { from: 0.2, to: 0.5 }, duration: 600, ease: 'Back.out' });
    this.tweens.add({ targets: logo, y: 112, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    this.tweens.add({ targets: logo, angle: { from: -1.5, to: 1.5 }, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.inOut' });

    // udstillingsbil: en ny tilfældig sammensætning hver gang
    makePartTextures(this);
    const pick = (l) => Phaser.Utils.Array.GetRandom(l), ch = pick(PARTS.chassis), wh = pick(PARTS.wheels);
    const cy = H - 60, car = this.add.container(960, cy).setScale(0.75 * (ch.scale || 1));
    const mo = pick(PARTS.motors), to = Math.random() < 0.85 ? pick(PARTS.tools) : null;
    const r = assembleCar(this, car, ch, wh, mo, to);
    // "Prøv mig!": byg netop denne bil i værkstedet
    const tryBtn = makeButton(this, 1000, cy - 212, 190, 58, 'Prøv mig!', 0x8e44ad, () => { TRYCAR = { chassis: ch, wheels: wh, motors: mo, tools: to }; this.scene.start('Build'); }, 28).setDepth(5);
    this.tweens.add({ targets: tryBtn, y: cy - 222, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    this.tweens.add({ targets: car, y: cy - 6, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    if (!r.upright) this.tweens.add({ targets: r.wheels, angle: 360, duration: 1500, repeat: -1 });

    // autokør / jeg styrer
    this.add.text(W / 2, 262, 'Hvem styrer?', { fontFamily: FONT, fontSize: '34px', color: '#fff', stroke: '#2c3e50', strokeThickness: 6 }).setOrigin(0.5);
    const paint = () => {
      this.btnAuto.setColor(SETTINGS.auto ? 0x27ae60 : 0x7f8c8d);
      this.btnManual.setColor(SETTINGS.auto ? 0x7f8c8d : 0x27ae60);
    };
    this.btnAuto = makeButton(this, W / 2 - 180, 325, 330, 84, 'Bilen kører selv', 0x27ae60, () => { SETTINGS.auto = true; saveSettings(); paint(); }, 28, 'ic_auto');
    this.btnManual = makeButton(this, W / 2 + 180, 325, 330, 84, 'Jeg styrer', 0x7f8c8d, () => { SETTINGS.auto = false; saveSettings(); paint(); }, 28, 'ic_wheel');
    paint();

    makeButton(this, W / 2, 450, 420, 110, 'BYG EN BIL!', 0xe67e22, () => this.scene.start('Build'), 46, 'ic_build');

    this.add.text(W / 2, 540, 'Tastatur: piletaster / A D kører, mellemrum hopper', { fontFamily: 'Arial', fontSize: '20px', color: '#2c3e50' }).setOrigin(0.5);
    if (SETTINGS.best > 0) this.add.text(W / 2, 572, 'Rekord: ' + Math.floor(SETTINGS.best) + ' m', { fontFamily: FONT, fontSize: '26px', color: '#fff', stroke: '#2c3e50', strokeThickness: 5 }).setOrigin(0.5);

    addCornerButtons(this);
    const ver = this.add.text(W - 14, H - 10, 'v0.27.1', { fontFamily: FONT, fontSize: '24px', color: '#ffffff', stroke: '#2c3e50', strokeThickness: 6 }).setOrigin(1, 1).setDepth(50).setInteractive();
    let taps = [];   // hemmelig: 5 hurtige tryk på versionsnummeret åbner prøvebanen
    ver.on('pointerdown', () => { const n = this.time.now; taps = taps.filter(t => n - t < 2500); taps.push(n);
      if (taps.length >= 5) { taps = []; this.cameras.main.flash(250, 255, 255, 255); this.time.delayedCall(260, () => this.demoPicker()); } });

    this.input.keyboard.on('keydown-SPACE', () => this.scene.start('Build'));
    this.input.keyboard.on('keydown-ENTER', () => this.scene.start('Build'));
  }
  demoPicker() {   // den hemmelige prøvebane: vælg et landskab (eller alle i rækkefølge)
    const items = [];
    const bg = this.add.rectangle(0, 0, W, H, 0x1b1f3a, 0.92).setOrigin(0).setDepth(80).setInteractive(); items.push(bg);
    items.push(this.add.text(W / 2, 70, 'Prøvebane – vælg landskab', { fontFamily: FONT, fontSize: '44px', color: '#fff', stroke: '#8e44ad', strokeThickness: 8 }).setOrigin(0.5).setDepth(81));
    DEMO_ORDER.forEach((k, i) => { const col = i % 3, row = Math.floor(i / 3);
      items.push(makeButton(this, W / 2 + (col - 1) * 300, 190 + row * 120, 270, 92, DEMO_NAMES[k], BIOMES[k].sky, () => startDemo(this, k), 34).setDepth(82)); });
    items.push(makeButton(this, W / 2 - 160, 600, 280, 80, 'Alle', 0x8e44ad, () => startDemo(this, null), 32).setDepth(82));
    items.push(makeButton(this, W / 2 + 160, 600, 280, 80, 'Luk', 0x7f8c8d, () => items.forEach(o => o.destroy()), 32).setDepth(82));
  }
}

function addCornerButtons(scene) {
  // to lydknapper: effekter (🔊) og musik (🎵); en rød streg over, når den er slået fra
  const strike = (btn, off) => { if (!btn.strike) { btn.strike = scene.add.rectangle(0, 0, 64, 8, 0xe74c3c).setStrokeStyle(2, 0xffffff).setAngle(-40); btn.add(btn.strike); } btn.strike.setVisible(off); btn.label.setAlpha(off ? 0.55 : 1); };
  const sfx = makeButton(scene, W - 60, 50, 80, 70, '🔊', 0x34495e, () => {
    SETTINGS.muted = !SETTINGS.muted; saveSettings(); SFX.setMuted(SETTINGS.muted); strike(sfx, SETTINGS.muted);
  }, 34).setDepth(60).setScrollFactor(0);
  const mus = makeButton(scene, W - 150, 50, 80, 70, '🎵', 0x34495e, () => {
    SETTINGS.musicOff = !SETTINGS.musicOff; saveSettings(); SFX.setMusicOff(SETTINGS.musicOff); strike(mus, SETTINGS.musicOff);
  }, 34).setDepth(60).setScrollFactor(0);
  strike(sfx, SETTINGS.muted); strike(mus, SETTINGS.musicOff);
  if (scene.scale.fullscreen.available) {
    makeButton(scene, W - 240, 50, 80, 70, '⛶', 0x34495e, () => scene.scale.toggleFullscreen(), 34).setDepth(60).setScrollFactor(0);
  }
}

class Game extends Phaser.Scene {

  // ---------- terræn ----------
  extendTerrain(untilX) {
    const t = this.t;
    while (t.x < untilX) {
      const x1 = t.x, y1 = t.y, x2 = x1 + SEG;
      let y2;
      if (x2 < 900 || DEMO) { y2 = GROUND_Y; t.slope = 0; }               // flad start – og prøvebanen er helt flad
      else {
        const d = Phaser.Math.Clamp((x2 - 900) / 10000, 0, 1);            // sværhed 0..1
        if (t.rampLeft > 0) {                                              // hoppebakke: op, op, op – så ned
          t.slope = t.rampLeft > 2 ? -0.55 : 1.1;
          t.rampLeft--;
        } else {
          if (x2 > t.nextRamp && d > 0.15) { t.rampLeft = 6; t.nextRamp = x2 + 1800 + Math.random() * 1800; }
          const maxS = 0.22 + 0.5 * d;
          t.slope += (Math.random() * 2 - 1) * (0.08 + 0.2 * d);
          t.slope += (GROUND_Y - y1) / 300 * 0.05;                         // træk mod midten
          t.slope = Phaser.Math.Clamp(t.slope, -maxS, maxS);
        }
        y2 = Phaser.Math.Clamp(y1 + t.slope * SEG, 240, 650);
      }
      t.pts.push({ x: x2, y: y2 });
      t.bodies.push(this.addSegment(x1, y1, x2, y2));
      t.x = x2; t.y = y2;
    }
  }

  addSegment(x1, y1, x2, y2) {
    const yb = 1400;
    const verts = [{ x: x1, y: y1 }, { x: x2, y: y2 }, { x: x2, y: yb }, { x: x1, y: yb }];
    const body = this.matter.add.fromVertices(0, 0, verts, { isStatic: true, friction: 0.9, label: 'ground', collisionFilter: { category: 2, mask: 0xFFFFFFFF } });
    const B = Phaser.Physics.Matter.Matter.Body;
    B.setPosition(body, { x: body.position.x + (x1 - body.bounds.min.x), y: body.position.y + (Math.min(y1, y2) - body.bounds.min.y) });
    body.segX2 = x2;
    return body;
  }

  setSky(c) {   // himlen er skærmens ryddefarve, ikke et ekstra lag, der males ovenpå (sparer en hel skærmfuld maling pr. billede)
    if (this.skyCol === c) return; this.skyCol = c;
    const rgb = Phaser.Display.Color.IntegerToRGB(c), r = this.game.renderer;
    if (r && r.config && r.config.backgroundColor) r.config.backgroundColor.setFromRGB(rgb);
  }
  setLite(on) {   // let tilstand: forgrund og skyer væk, mindre pynt, ingen ildfluer
    this.lite = on; SETTINGS.lite = on; this.wxCur = undefined; this.biomeKey = null;
    this.fg.setVisible(!on); this.clouds.setVisible(!on);
  }
  extendBiomes() {   // startlandskabet først, så de andre i tilfældig rækkefølge – derefter alle ni blandet, uden at to ens støder sammen
    if (DEMO && DEMO_BIOME) { while (this.biomeSeq.length < 400) this.biomeSeq.push(DEMO_BIOME); return; }   // prøvebane med ét landskab
    while (this.biomeSeq.length < 40) {
      const all = Object.keys(BIOMES), block = Phaser.Utils.Array.Shuffle(this.biomeSeq.length === 1 ? all.filter(k => k !== this.biomeSeq[0]) : all.slice());
      if (block[0] === this.biomeSeq[this.biomeSeq.length - 1]) block.push(block.shift());
      this.biomeSeq.push(...block);
    }
  }
  // landskabet ved verdens-x: {a, b, t} – t er hvor langt overgangen fra a til b er nået
  biomeAt(x) {
    const d = Math.max(0, (x - (this.startX || 220)) / PX_PER_M), i = Math.floor(d / this.bLen);
    if (i >= this.biomeSeq.length - 2) this.extendBiomes();
    const b = BIOMES[this.biomeSeq[i]], a = BIOMES[this.biomeSeq[Math.max(0, i - 1)]], t = i === 0 ? 1 : Phaser.Math.Clamp((d - i * this.bLen) / this.bFade, 0, 1);
    return { a, b, t, farA: a.far, farB: b.far, nameA: this.biomeSeq[Math.max(0, i - 1)], nameB: this.biomeSeq[i] };
  }
  updateBiome(x) {
    const m = this.biomeAt(x), t = m.t;
    const key = m.a === m.b ? 'same' + m.farA : (m.farA + m.farB + (t * 200 | 0));   // intet nyt at regne på mellem overgangene
    if (key === this.biomeKey) return; this.biomeKey = key;
    this.biomeCols = { dirt: lerpColor(m.a.dirt, m.b.dirt, t), grass: lerpColor(m.a.grass, m.b.grass, t) };
    this.setSky(lerpColor(m.a.sky, m.b.sky, t));
    const hc = lerpColor(m.a.hills, m.b.hills, t); this.hills.setTint(hc); this.hillsB.setTint(hc); this.groundBg.setFillStyle(lerpColor(m.a.ground, m.b.ground, t));
    // tileSprites laver deres eget internt billede, så texture.key passer aldrig – vi husker selv, hvad der er lagt på (ellers lægges det på igen hvert billede: ~15 ms)
    const setTex = (o, k) => { if (o.texKey !== k) { o.texKey = k; o.setTexture(k); } };
    setTex(this.hills, m.farA); setTex(this.hillsB, m.farB);
    const th = this.lite ? (t < 0.5 ? 0 : 1) : t;   // let tilstand: bakkerne skifter på én gang i stedet for at tone over (to lag oven i hinanden koster)
    this.hills.setAlpha(1 - th).setVisible(th < 1); this.hillsB.setAlpha(th).setVisible(th > 0);
    this.matter.world.setGravity(0, (m.a.gravity || 1) * (1 - t) + (m.b.gravity || 1) * t);   // månen: lav tyngdekraft
    const sa = m.a.skyDeco, sb = m.b.skyDeco;
    if (sa) setTex(this.skyA, sa); if (sb) setTex(this.skyB, sb);
    this.skyA.setAlpha(1 - t).setVisible(!this.lite && !!sa && t < 1); this.skyB.setAlpha(t).setVisible(!this.lite && !!sb && t > 0);   // himmelpynten (stjerner m.m.) springes over i let tilstand
    this.sun.setAlpha((m.a.sun ? 1 - t : 0) + (m.b.sun ? t : 0)).setVisible(!!(m.a.sun || m.b.sun));
    this.night = (m.a.night ? 1 - t : 0) + (m.b.night ? t : 0);
    const cl = (m.a.clouds ?? 1) * (1 - t) + (m.b.clouds ?? 1) * t; this.clouds.setAlpha((1 - this.night * 0.6) * cl);   // ingen skyer på månen
    const fb = t < 0.5 ? m.a : m.b, fk = fb.fg || 'fg_grass'; setTex(this.fg, fk);   // forgrund efter landskab
    if (fk === 'fg_grass') this.fg.setTint(this.biomeCols.grass); else this.fg.clearTint();
    this.wxType = fb.weather || null; this.wxTints = fb.wxTints || null; this.wxFade = Math.abs(t * 2 - 1);
  }
  updateWeather(delta, scrollX) {   // sne, blade, sand, glimmer eller ildfluer – i spare-tilstand kun hver tredje
    const type = this.wxType, k = delta / 16.7, dx = scrollX - this.wxLastX; this.wxLastX = scrollX;
    if (type !== this.wxCur) { this.wxCur = type;
      this.wx.forEach((p, i) => { p.setVisible(!!type && (!this.lite || i % 3 === 0)); if (!type) return;
        p.setTexture({ snow: 'wx_snow', leaves: 'wx_leaf', sand: 'wx_sand', glitter: 'wx_spark', fireflies: 'wx_fly' }[type]);
        if (this.wxTints) p.setTint(Phaser.Utils.Array.GetRandom(this.wxTints)); else p.clearTint();
        p.x = Math.random() * W; p.y = type === 'sand' || type === 'fireflies' ? H * 0.35 + Math.random() * H * 0.6 : Math.random() * H;
        p.ph = Math.random() * 6.28; p.sp = 0.5 + Math.random();
        p.setScale(type === 'snow' ? 0.4 + p.sp * 0.5 : type === 'leaves' ? 0.8 + p.sp * 0.5 : type === 'glitter' ? 0.5 + p.sp * 0.4 : 1); }); }
    if (!type) return;
    const t = this.time.now / 1000;
    this.wx.forEach(p => { if (!p.visible) return;
      p.x -= dx * (0.3 + p.sp * 0.4);   // lidt parallax, så de føles som en del af verden
      if (type === 'snow') { p.y += (0.7 + p.sp * 0.8) * k; p.x += Math.sin(t * 1.3 + p.ph) * 0.6 * k; p.setAlpha(0.85 * this.wxFade); }
      else if (type === 'leaves') { p.y += (0.8 + p.sp * 0.7) * k; p.x += Math.sin(t * 1.6 + p.ph) * 1.6 * k - 0.4 * k; p.rotation += 0.04 * p.sp * k; p.scaleY = Math.abs(Math.cos(t * 2 + p.ph)) * p.scaleX * 0.9 + 0.1; p.setAlpha(this.wxFade); }
      else if (type === 'sand') { p.x -= (5 + p.sp * 4) * k; p.y += Math.sin(t * 3 + p.ph) * 0.5 * k; p.setTint(0xf0cf8e).setAlpha(0.5 * this.wxFade); }
      else if (type === 'glitter') { p.y += 0.35 * p.sp * k; p.x += Math.sin(t + p.ph) * 0.4 * k; p.rotation += 0.02 * k; p.setAlpha((0.4 + 0.6 * Math.abs(Math.sin(t * 2.5 + p.ph))) * this.wxFade); }
      else { p.x += Math.sin(t * 0.7 + p.ph) * 0.9 * k; p.y += Math.cos(t * 0.9 + p.ph * 1.3) * 0.6 * k; p.setAlpha(Math.max(0, Math.sin(t * 2 + p.ph)) * this.wxFade); }
      if (p.y > H + 12) { p.y = -12; p.x = Math.random() * W; } if (p.y < -14) p.y = H + 10;
      if (p.x < -20) { p.x = W + 18; if (type === 'sand' || type === 'fireflies') p.y = H * 0.35 + Math.random() * H * 0.6; } if (p.x > W + 22) p.x = -18; });
  }
  spawnMid(scrollX, carX) {   // mellemlaget: ting med 45 % parallax, placeret i tilfældig størrelse og afstand, så rækken aldrig gentager sig
    const px = scrollX * 0.45;
    while (this.nextMidX < px + W + 300) {
      const m = this.biomeAt(carX + 700), bio = m.t < 0.5 ? m.a : m.b, def = Phaser.Utils.Array.GetRandom(bio.mid);
      const sc = (def.scale ? def.scale[0] + Math.random() * (def.scale[1] - def.scale[0]) : 0.7 + Math.random() * 0.6);
      const img = this.add.image(this.nextMidX, 532, def.k).setOrigin(0.5, 1).setScrollFactor(0.45, 0.3).setDepth(-1).setScale(sc);
      if (def.tint) img.setTint(def.tint);
      if (def.snow) { const cap = this.add.image(this.nextMidX, 532 - img.displayHeight + 6, 'mid_snowcap').setOrigin(0.5, 1).setScrollFactor(0.45, 0.3).setDepth(-1).setScale(sc); cap.midTag = true; this.mids.push(cap); }
      if (def.lit) img.setTint(def.tint);
      if (def.smoke && !this.lite) for (let i = 0; i < 3; i++) { const pf = this.add.image(this.nextMidX + def.smoke[0] * sc, 532 + def.smoke[1] * sc, 'smoke').setScrollFactor(0.45, 0.3).setDepth(-1).setAlpha(0).setScale(0.5 * sc); pf.midTag = true; this.mids.push(pf);
        this.tweens.add({ targets: pf, y: pf.y - 60 * sc, x: pf.x + 20 * sc, alpha: { from: 0.7, to: 0 }, scale: { from: 0.5 * sc, to: 1.3 * sc }, duration: 2400, delay: i * 800, repeat: -1 }); }
      this.mids.push(img);
      this.nextMidX += (this.lite ? 260 : 150) + Math.random() * 260;
    }
    this.mids = this.mids.filter(o => { if (o.x < px - 400) { this.tweens.killTweensOf(o); o.destroy(); return false; } return true; });
  }

  spawnDecor(untilX) {   // pynt langs vejen i det landskab, der gælder dér
    while (this.nextDecorX < untilX) {
      const x = this.nextDecorX, m = this.biomeAt(x), bio = m.t < 0.5 ? m.a : m.b; let key = Phaser.Utils.Array.GetRandom(bio.decor);
      if (this.lite) { if (key === 'firefly') key = 'bush'; this.nextDecorX += 300; }
      const img = this.add.image(x, this.groundY(x) + 4, key).setOrigin(0.5, 1).setDepth(1).setScale(0.8 + Math.random() * 0.5);
      if (key === 'firefly') { img.setY(this.groundY(x) - 40 - Math.random() * 120).setDepth(7); this.tweens.add({ targets: img, alpha: 0.1, y: img.y - 20, duration: 500 + Math.random() * 600, yoyo: true, repeat: -1 }); }
      if (key === 'lamp' && this.night > 0.3) { const glow = this.add.image(x, this.groundY(x) - 140, 'smoke').setTint(0xfff3b0).setAlpha(0.35).setScale(4).setDepth(1); this.actors.push(glow); }
      this.actors.push(img);
      this.nextDecorX = x + 160 + Math.random() * 260;
    }
  }

  trimTerrain(behindX) {
    const t = this.t;
    while (t.bodies.length && t.bodies[0].segX2 < behindX) { this.matter.world.remove(t.bodies.shift()); t.pts.shift(); }
  }

  drawTerrain() {
    const g = this.t.gfx, cam = this.cameras.main;
    const x0 = cam.scrollX - 100, x1 = cam.scrollX + W + 100;
    const pts = this.t.pts.filter(p => p.x >= x0 - SEG && p.x <= x1 + SEG);
    if (pts.length < 2) return;
    g.clear();
    g.fillStyle(this.biomeCols.dirt);
    g.beginPath(); g.moveTo(pts[0].x, 1400);
    pts.forEach(p => g.lineTo(p.x, p.y));
    g.lineTo(pts[pts.length - 1].x, 1400); g.closePath(); g.fillPath();
    g.lineStyle(14, this.biomeCols.grass);
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.strokePath();
  }

  // ---------- køretøj ----------
  buildVehicle(x, y) {
    const V = VEHICLE;
    const filter = { group: GRP_CAR };   // delene støder ikke mod hinanden
    this.constraints = [];
    this.chassis = this.matter.add.image(x, y, 'v_body', null, {
      shape: { type: 'rectangle', width: V.chassis.w / V.chassis.scale, height: V.chassis.h / V.chassis.scale },
      chamfer: { radius: 10 }, density: V.chassis.density, friction: 0.1, frictionAir: 0.004, restitution: 0.1,
      collisionFilter: filter, label: 'chassis'
    }).setDepth(10).setScale(V.chassis.scale);
    this.topOy = (BUILD.chassis.full ? -(BUILD.chassis.topH / 2 + 12) * V.chassis.scale : -(V.chassis.h / 2 + V.chassis.topH / 2)) - TOP_EXTRA / 2 * V.chassis.scale;
    this.topOx = V.chassis.topOx;

    else if (!sawNow && this.sawSnd) { this.sawSnd.stop(); this.sawSnd = null; }
    this.trimObstacles(c.x - W * 1.5);
    this.actors.forEach(a => a.tick && a.tick(this, time));
    this.drawTerrain();
    const cam = this.cameras.main;
    // parallax: jo længere væk, jo langsommere – og lagene glider lidt lodret, når bilen flyver op
    const dy = cam.scrollY - (GROUND_Y - 480);   // 0 ved kørsel på flad jord, negativ når kameraet er oppe
    [this.hills, this.hillsB].forEach(st => { if (st.visible) { st._x = cam.scrollX * 0.15; st.y = H - 500 - dy * 0.12; } });
    [this.skyA, this.skyB].forEach(st => { if (st.visible) { st._x = cam.scrollX * 0.02; st.y = -dy * 0.05; } }); this.sun.y = 120 - dy * 0.05;
    this.spawnMid(cam.scrollX, c.x);
    this.groundBg.y = H - 200 - dy * 0.3;
    if (this.clouds.visible) { this.clouds._x = cam.scrollX * 0.04 + time * 0.01; this.clouds.y = -dy * 0.06; }
    this.updateWeather(delta, cam.scrollX);
    if (this.fg.visible) { this.fg._x = cam.scrollX * 0.9; this.fg.y = H - 140 - dy * 1.0; }
    // forlygter om natten
    if (this.night > 0.02 && !this.broken) {
      if (!this.beamImg) this.beamImg = this.add.image(0, 0, 'headlight').setDepth(9).setOrigin(0, 0.5);
      const a = c.rotation, fx = V.chassis.w / 2, fy = -V.chassis.h * 0.2;
      this.beamImg.setPosition(c.x + fx * Math.cos(a) - fy * Math.sin(a), c.y + fx * Math.sin(a) + fy * Math.cos(a)).setRotation(a + 0.08).setAlpha(this.night * 0.55).setVisible(true);
    } else if (this.beamImg) this.beamImg.setVisible(false);

    // score
    const dist = (c.x - this.startX) / PX_PER_M;
    if (dist > this.maxDist) { this.maxDist = dist; if (this.ui) this.ui.distText.setText(Math.floor(dist) + ' m'); }

    if (this.broken) return;

    // ude af banen: baglæns ud over kanten eller ned i et hul
    if (c.x < this.t.pts[0].x + W * 0.6) return this.endRound(false, 'Du trillede ud af banen!');   // slutter, før banens bagkant kommer ind på skærmen
    if (c.y > 1500) return this.endRound(false, 'Bilen faldt i et hul!');

    // vendt på hovedet?
    const ang = Math.abs(Phaser.Math.Angle.Wrap(c.rotation));
    const chassisDown = time - this.chassisGroundTime < 120;
    if (ang > 2.2 && chassisDown) { if (!this.flipTime) this.flipTime = time; } else this.flipTime = 0;
    if (this.flipTime && time - this.flipTime > 1300) return this.endRound(false, 'Bilen vendte på hovedet!');

    // sidder fast? (er ikke kommet 15 px nogen vej i 4 sekunder)
    if (Math.abs(c.x - this.progressX) > 15) { this.progressX = c.x; this.progressTime = time; }
    if (time - this.progressTime > 4000) return this.endRound(false, 'Bilen sidder fast!');
  }

  endRound(quiet, reason) {
    if (this.over) return;
    this.over = true;
    this.matter.world.pause();
    this.cameras.main.stopFollow();   // kameraet står stille, så man ikke ser ud over den tegnede jord
    SFX.stopEngine();
    const dist = Math.floor(this.maxDist);
    const record = dist > 0 && dist > Math.floor(SETTINGS.best);
    if (record) { SETTINGS.best = dist; saveSettings(); }
    if (!quiet) { SFX.crash(); if (record) setTimeout(() => { SFX.tada(); if (this.scene.isActive()) confetti(this); }, 500); }

    if (this.ui) this.ui.showGameOver(dist, record, reason);
    setTimeout(() => {
      if (!this.scene.isActive()) return;
      this.input.keyboard.once('keydown-SPACE', () => this.restartRound());
      this.input.keyboard.once('keydown-ENTER', () => this.restartRound());
    }, 600);
  }

  restartRound() { this.scene.stop('UI'); this.scene.restart(); }
  toBuild()      { endDemo(); this.scene.stop('UI'); this.scene.start('Build'); }
  toMenu()       { endDemo(); this.scene.stop('UI'); this.scene.start('Title'); }
}

// =====================================================================
// ---------- baggrundsstrimmel: to billeder side om side i stedet for en tileSprite ----------
// En tileSprite kopierer sit billede til et stort lærred og sender det til grafikkortet, hver gang billedet skiftes (8-17 MB ved hvert baneskift).
// To almindelige billeder kan skifte billede gratis, og der er ingen kant, der kan smitte af.
class Strip {
  constructor(scene, y, key, depth, scale) {
    this.sc = scale || 1; this._x = 0; this._y = y; this.texKey = key; this.visible = true;
    this.imgs = [0, 1].map(() => scene.add.image(0, y, key).setOrigin(0).setScrollFactor(0).setDepth(depth).setScale(this.sc));
    this.place();
  }
  get tw() { return this.imgs[0].width * this.sc; }
  place() { const w = this.tw, x = -Math.round((((this._x * this.sc) % w) + w) % w); this.imgs[0].setPosition(x, this._y); this.imgs[1].setPosition(x + w, this._y); }
  set tilePositionX(v) { this._x = v; this.place(); } get tilePositionX() { return this._x; }
  set y(v) { this._y = v; this.place(); } get y() { return this._y; }
  setTexture(k) { this.imgs.forEach(i => i.setTexture(k)); this.place(); return this; }
  setTint(c) { this.imgs.forEach(i => i.setTint(c)); return this; }
  clearTint() { this.imgs.forEach(i => i.clearTint()); return this; }
  setAlpha(a) { this.imgs.forEach(i => i.setAlpha(a)); return this; }
  setVisible(v) { this.visible = v; this.imgs.forEach(i => i.setVisible(v)); return this; }
}

// ---------- altid liggende ----------
// Nyere Android ignorerer appens ønske om at ligge ned på tablets. Står skærmen op (berøringsskærm), drejer vi selv spillet 90 grader.
let ROTATED = false;
function applyRotation() {
  const wrap = document.getElementById('wrap'), iw = window.innerWidth, ih = window.innerHeight;
  ROTATED = ih > iw && window.matchMedia('(pointer: coarse)').matches;
  document.body.classList.toggle('rot', ROTATED);
  wrap.style.width = (ROTATED ? ih : iw) + 'px'; wrap.style.height = (ROTATED ? iw : ih) + 'px'; wrap.style.left = (ROTATED ? iw : 0) + 'px';
  if (window.game && game.isBooted && game.canvas) game.scale.refresh();
}
window.addEventListener('resize', applyRotation); window.addEventListener('orientationchange', () => setTimeout(applyRotation, 200));
applyRotation();
function patchRotation(game) {
  // Phaser måler forælderens størrelse på skærmen (drejet = forkert vej) – vi bruger layout-størrelsen i stedet
  const sm = game.scale;
  sm.getParentBounds = function () { const w = this.parent.offsetWidth, h = this.parent.offsetHeight;
    if (this.parentSize.width !== w || this.parentSize.height !== h) { this.parentSize.setSize(w, h); return true; }
    const r = this.canvas && this.canvas.getBoundingClientRect(); return !!r && (r.x !== this.canvasBounds.x || r.y !== this.canvasBounds.y); };
  // berøringer: skærmens punkt regnes om til et punkt i det udrejede spil
  const im = game.input, orig = im.transformPointer.bind(im);
  im.transformPointer = function (pointer, pageX, pageY, wasMove) {
    if (!ROTATED) return orig(pointer, pageX, pageY, wasMove);
    const cv = game.canvas, cb = sm.canvasBounds, u = pageY - window.scrollY, v = window.innerWidth - (pageX - window.scrollX);
    const gx = (u - cv.offsetLeft) * (W / cv.offsetWidth), gy = (v - cv.offsetTop) * (H / cv.offsetHeight);   // spillets egne koordinater
    return orig(pointer, cb.left + gx / sm.displayScale.x, cb.top + gy / sm.displayScale.y, wasMove);   // Phaser regner dem tilbage med sin egen skala
  };
  sm.refresh();
}
// ---------- fysik: ingen læk af berøringspar ----------
// Matter lægger også faste kroppe (jorden) i dvale, og et par med en sovende krop fjernes aldrig. Så voksede listen over berøringer hele runden,
// og fysikken blev langsommere og langsommere (10x efter 3 minutter). Faste kroppe må ikke sove, og en krop vækkes, før den fjernes.
(function () {
  const M = Phaser.Physics.Matter.Matter, Sl = M.Sleeping, set = Sl.set;
  Sl.set = function (b, z) { if (z && b.isStatic) return; return set.call(this, b, z); };
  const WP = Phaser.Physics.Matter.World.prototype, rm = WP.remove;
  WP.remove = function (o, d) { (Array.isArray(o) ? o : [o]).forEach(x => { const b = x && (x.body || x); if (b && b.isSleeping) set.call(Sl, b, false); }); return rm.call(this, o, d); };
})();
function startGame() { window.game = new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  parent: 'wrap',
  backgroundColor: '#7ec8e3',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.NO_CENTER, fullscreenTarget: document.documentElement },   // centreres af #wrap (flex), som også virker drejet
  physics: { default: 'matter', matter: { gravity: { y: 1.0 }, runner: { isFixed: true, fps: 60 }, enableSleeping: true, positionIterations: 12, velocityIterations: 8, constraintIterations: 4, debug: false } },
  audio: { noAudio: true },
  disablePreFX: true, disablePostFX: true,   // spillet bruger ingen effekter: sparer ~60 MB grafikhukommelse
  scene: [Title, Build, Game, UI]
}); window.game.events.once('ready', () => patchRotation(window.game)); }
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load("700 20px 'Fredoka'"), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(startGame, startGame);
