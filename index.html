<script>
// =====================================================================
//  Biglers Biler – etape 3  (v0.8.1)
//  Enarmet tyveknægt (chassis/hjul/motor/værktøj), bakket terræn, hop,
//  autokør/fuld styring, forhindringer, skade/røg/sammenbrud, lyd i kode
// =====================================================================
const W = 1280, H = 720;
const FONT = "'Fredoka', 'Arial Black', Arial, sans-serif";   // rund tegneserieskrift, falder tilbage til Arial
const SEG = 48;            // terrænsegmentets bredde i px
const GROUND_Y = 520;      // udgangshøjde for jorden
const PX_PER_M = 50;       // 50 px = 1 meter i scoren
const GRP_CAR = -100000, GRP_PIECE = -100001;   // egne grupper, langt fra dem motoren selv uddeler (-1, -2, ...)

// Alle dele har parametre, så etape 3 bare udfylder dem pr. del.
let VEHICLE = {   // sættes ud fra de valgte dele i Game.create (vehicleFromBuild)
  chassis: { w: 170, h: 48, density: 0.003, topH: 80 },
  wheel:   { r: 30, back: -58, front: 58, oy: 22, density: 0.004, grip: 1.0 },
  motor:   { power: 0.33, pitch: 1.0, accel: 0.15 },
  tool: null, mass: 45, jump: 12
};

// ---------- gemte indstillinger ----------
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const SETTINGS = {
  auto:  lsGet('fk_auto', '1') !== '0',
  muted: lsGet('fk_muted', '0') === '1',
  best:  parseFloat(lsGet('fk_best', '0')) || 0,
  lite:  false   // let tilstand – sættes automatisk i denne session, hvis enheden hakker
};
function saveSettings() {
  lsSet('fk_auto', SETTINGS.auto ? '1' : '0');
  lsSet('fk_muted', SETTINGS.muted ? '1' : '0');
  lsSet('fk_best', String(SETTINGS.best));
}

// ---------- lyd (alt i kode) ----------
const SFX = {
  ctx: null, master: null, eng: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { this.ctx = new AC(); }
    this.master = this.ctx.createGain();
    this.master.gain.value = SETTINGS.muted ? 0 : 1;
    this.master.connect(this.ctx.destination);
  },
  setMuted(m) { if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 1, this.ctx.currentTime, 0.02); },
  startEngine() {
    if (!this.ctx || this.eng) return;
    const c = this.ctx;
    const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 50;
    const o2 = c.createOscillator(); o2.type = 'square';   o2.frequency.value = 25;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200;
    const g = c.createGain(); g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o1.start(); o2.start();
    this.eng = { o1, o2, f, g };
  },
  engine(speed, on) {           // speed 0..1
    if (!this.eng) return;
    const t = this.ctx.currentTime;
    const base = (30 + speed * 70 + (on ? 10 : 0)) * VEHICLE.motor.pitch;
    this.eng.o1.frequency.setTargetAtTime(base, t, 0.06);
    this.eng.o2.frequency.setTargetAtTime(base / 2, t, 0.06);
    this.eng.f.frequency.setTargetAtTime((160 + speed * 300) * VEHICLE.motor.pitch, t, 0.06);
    this.eng.g.gain.setTargetAtTime(on ? 0.09 : 0.04, t, 0.1);
  },
  stopEngine() {
    if (!this.eng) return;
    const e = this.eng; this.eng = null;
    e.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
    setTimeout(() => { try { e.o1.stop(); e.o2.stop(); } catch (x) {} }, 500);
  },
  blip(f0, f1, dur, type, vol) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, cutoff) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  jump()  { this.blip(300, 800, 0.18, 'sine', 0.25); },
  land(i) { this.noise(0.11, Math.min(0.5, 0.12 + i * 0.08), 160 + i * 40); this.blip(70, 35, 0.12, 'sine', Math.min(0.5, 0.15 + i * 0.08)); },
  crash() { this.noise(0.5, 0.5, 600); this.blip(200, 40, 0.5, 'sawtooth', 0.3); },
  hit(k)  { this.noise(0.15 + k * 0.2, 0.2 + k * 0.4, 300 + k * 900); this.blip(120, 40, 0.15 + k * 0.2, 'sawtooth', 0.15 + k * 0.3); },
  bigCrash() { this.noise(0.9, 0.7, 1200); this.blip(300, 30, 0.9, 'sawtooth', 0.4); setTimeout(() => this.blip(500, 120, 0.4, 'square', 0.2), 250); },
  wood()  { this.noise(0.15, 0.35, 1400); this.blip(320, 110, 0.1, 'square', 0.15); },
  say(k)  {   // væsenernes udbrud
    if (k === 'moo') return this.moo();
    if (k === 'squawk') { this.blip(900, 1400, 0.12, 'square', 0.15); setTimeout(() => this.blip(1100, 1500, 0.1, 'square', 0.12), 140); }
    else if (k === 'bark') { this.blip(260, 180, 0.12, 'sawtooth', 0.22); setTimeout(() => this.blip(280, 170, 0.12, 'sawtooth', 0.2), 160); }
    else if (k === 'hoot') { this.blip(330, 300, 0.25, 'sine', 0.22); setTimeout(() => this.blip(300, 260, 0.35, 'sine', 0.2), 300); }
    else if (k === 'grunt') { this.blip(140, 90, 0.4, 'sawtooth', 0.2); this.noise(0.3, 0.12, 600); }
    else if (k === 'ooh') { [500, 650, 800, 650].forEach((f, i) => setTimeout(() => this.blip(f, f * 1.2, 0.1, 'square', 0.14), i * 110)); }
    else if (k === 'baa') { this.blip(420, 380, 0.5, 'sawtooth', 0.14); }
    else if (k === 'whee') { this.blip(400, 1600, 0.6, 'sine', 0.16); }
    else if (k === 'chime') { [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => this.blip(f, f, 0.25, 'sine', 0.12), i * 90)); }
  },
  bonk()  { this.blip(220, 60, 0.3, 'square', 0.25); this.noise(0.1, 0.3, 900); },
  saw()   { this.noise(0.12, 0.2, 2200); this.blip(900, 700, 0.12, 'sawtooth', 0.08); },
  metal() { this.blip(900, 250, 0.35, 'sawtooth', 0.2); this.noise(0.2, 0.3, 2500); },
  splat() { this.noise(0.25, 0.35, 900); this.blip(420, 110, 0.3, 'sine', 0.3); },
  pop()   { this.blip(1000, 180, 0.07, 'square', 0.3); },
  boing() { this.blip(140, 700, 0.3, 'sine', 0.3); this.blip(280, 1400, 0.3, 'triangle', 0.12); },
  bounce(){ this.blip(220, 440, 0.15, 'sine', 0.25); },
  moo()   { this.blip(230, 150, 0.5, 'sawtooth', 0.22); this.blip(115, 75, 0.5, 'triangle', 0.15); },
  pff()   { this.noise(0.18, 0.2, 500); },
  tick()  { this.blip(1200, 900, 0.03, 'square', 0.06); },
  stop()  { this.blip(500, 250, 0.1, 'square', 0.2); this.noise(0.05, 0.2, 2000); },
  clunk() { this.noise(0.12, 0.35, 500); this.blip(160, 60, 0.15, 'sine', 0.35); },
  pow()   { this.noise(0.1, 0.4, 1500); this.blip(200, 80, 0.12, 'square', 0.3); },
  chomp() { this.noise(0.06, 0.4, 2500); this.blip(500, 120, 0.1, 'square', 0.3); },
  glass() { this.noise(0.25, 0.3, 6000); [2400, 3100, 1900].forEach((f, i) => setTimeout(() => this.blip(f, f * 0.7, 0.12, 'sine', 0.12), i * 40)); },
  crunch(){ this.noise(0.3, 0.45, 900); this.blip(90, 40, 0.3, 'sawtooth', 0.25); },
  rockBreak() { this.noise(0.4, 0.5, 700); this.blip(140, 50, 0.3, 'square', 0.3); },
  porcelain() { this.noise(0.3, 0.4, 4000); this.blip(1500, 500, 0.2, 'triangle', 0.2); },
  whoosh(){ this.noise(0.35, 0.15, 2500); this.blip(300, 900, 0.35, 'sine', 0.08); },
  flush() { this.noise(0.7, 0.3, 1200); [0, 120, 260, 420].forEach((d, i) => setTimeout(() => this.blip(420 - i * 60, 160, 0.18, 'sine', 0.2), d)); },
  click() { this.blip(600, 900, 0.08, 'square', 0.1); },
  ufo()   { [0, 150, 300, 450].forEach(d => setTimeout(() => this.blip(600, 1200, 0.14, 'sine', 0.12), d)); },
  zap()   { this.blip(1800, 200, 0.4, 'sawtooth', 0.2); this.noise(0.3, 0.3, 3000); },
  pfft() { this.noise(0.6, 0.35, 1800); this.blip(900, 120, 0.6, 'sawtooth', 0.1); this.blip(1400, 300, 0.5, 'sine', 0.08); },
  tada()  { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, f, 0.25, 'triangle', 0.25), i * 120)); }
};
document.addEventListener('pointerdown', () => SFX.init(), { passive: true });
document.addEventListener('keydown', () => SFX.init());

// ---------- teksturer tegnet i kode ----------
function makeTextures(s) {
  if (s.textures.exists('chassis')) return;
  const V = VEHICLE;
  let g = s.add.graphics();

  // chassis (selve kassen, samme størrelse som fysikkroppen)
  g.fillStyle(0xe74c3c); g.fillRoundedRect(0, 0, V.chassis.w, V.chassis.h, 10);
  g.fillStyle(0xc0392b); g.fillRoundedRect(0, V.chassis.h - 14, V.chassis.w, 14, { tl: 0, tr: 0, bl: 10, br: 10 });
  g.fillStyle(0xfff3b0); g.fillRoundedRect(V.chassis.w - 16, 8, 12, 14, 4);      // forlygte
  g.fillStyle(0xff3b3b); g.fillRoundedRect(4, 8, 10, 14, 4);                       // baglygte
  g.generateTexture('chassis', V.chassis.w, V.chassis.h); g.clear();

  // overdel: motor bagved, førerhus foran, lille ansigt i vinduet (170 x 56)
  g.fillStyle(0x7f8c8d); g.fillRect(10, 0, 10, 22);                                 // udstødningsrør
  g.fillStyle(0xf1c40f); g.fillRoundedRect(4, 18, 54, 38, 6);                       // motor
  g.fillStyle(0xd4ac0d); g.fillRect(12, 26, 38, 6); g.fillRect(12, 38, 38, 6);
  g.fillStyle(0x3498db); g.fillRoundedRect(72, 0, 92, 56, { tl: 16, tr: 20, bl: 0, br: 0 }); // førerhus
  g.fillStyle(0xbdefff); g.fillRoundedRect(84, 8, 70, 34, 8);                       // vindue
  g.fillStyle(0xffd8b0); g.fillCircle(119, 27, 13);                                 // hoved
  g.fillStyle(0x5a3a1a); g.fillRoundedRect(106, 12, 26, 10, 5);                     // hår
  g.fillStyle(0x222222); g.fillCircle(114, 27, 2); g.fillCircle(124, 27, 2);        // øjne
  g.lineStyle(2, 0x222222); g.beginPath(); g.arc(119, 30, 5, 0.2, Math.PI - 0.2); g.strokePath(); // smil
  g.generateTexture('top', 170, 56); g.clear();

  // hjul
  const r = V.wheel.r, c = r + 2;
  g.fillStyle(0x222222); g.fillCircle(c, c, r);
  g.fillStyle(0x95a5a6); g.fillCircle(c, c, r * 0.62);
  g.lineStyle(5, 0xf39c12);
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.cos(a) * r * 0.55, c + Math.sin(a) * r * 0.55); g.strokePath(); }
  g.fillStyle(0xe67e22); g.fillCircle(c, c, 6);
  g.generateTexture('wheel', c * 2, c * 2); g.clear();

  // røg, gnist, stump
  g.fillStyle(0xffffff); g.fillCircle(12, 12, 12);
  g.generateTexture('smoke', 24, 24); g.clear();
  g.fillStyle(0xffffff); g.beginPath(); g.arc(22, 30, 22, -2.2, -0.9, false); g.arc(22, 30, 12, -0.9, -2.2, true); g.closePath(); g.fillPath();   // ballonstump
  g.generateTexture('shard', 44, 36); g.clear();
  C(g, 10, 10, 9, 0xffffff, 0.55); C(g, 10, 10, 5, 0xffffff); g.generateTexture('blink', 20, 20); g.clear();   // udrykningsblink (tones i farven)
  // knap-ikoner (64 x 64)
  const icon = (key, fn) => { g.clear(); fn(); g.generateTexture(key, 64, 64); g.clear(); };
  icon('ic_car', () => { R(g, 4, 26, 56, 22, 8, 0xffffff); R(g, 16, 12, 30, 20, { tl: 10, tr: 12, bl: 0, br: 0 }, 0xffffff); R(g, 22, 16, 18, 12, 4, 0x3498db); C(g, 17, 50, 9, 0x2c3e50); C(g, 47, 50, 9, 0x2c3e50); C(g, 17, 50, 3, 0xffffff); C(g, 47, 50, 3, 0xffffff); });
  icon('ic_auto', () => { R(g, 4, 26, 56, 22, 8, 0xffffff); R(g, 16, 12, 30, 20, { tl: 10, tr: 12, bl: 0, br: 0 }, 0xffffff); R(g, 22, 16, 18, 12, 4, 0x3498db); C(g, 17, 50, 9, 0x2c3e50); C(g, 47, 50, 9, 0x2c3e50); C(g, 17, 50, 3, 0xffffff); C(g, 47, 50, 3, 0xffffff);
    Q(g, 2, 8, 12, 3, 0xffffff); Q(g, 0, 14, 10, 3, 0xffffff); Q(g, 4, 2, 8, 3, 0xffffff); });   // bil med fartstreger
  icon('ic_wheel', () => { g.lineStyle(9, 0xffffff); g.strokeCircle(32, 32, 24); C(g, 32, 32, 9, 0xffffff); g.lineStyle(7, 0xffffff); [0, 2.1, 4.2].forEach(a => { g.beginPath(); g.moveTo(32, 32); g.lineTo(32 + Math.cos(a + 1.57) * 22, 32 + Math.sin(a + 1.57) * 22); g.strokePath(); }); });   // rat
  icon('ic_build', () => { g.save(); g.translateCanvas(32, 34); g.rotateCanvas(-0.7); R(g, -6, -8, 12, 36, 4, 0xd4a56a); R(g, -22, -24, 44, 20, 6, 0x95a5a6); g.restore(); });   // hammer
  icon('ic_again', () => { g.lineStyle(9, 0xffffff); g.beginPath(); g.arc(32, 32, 20, -1.2, 4.2, false); g.strokePath(); g.fillStyle(0xffffff); g.fillTriangle(40, 4, 58, 16, 38, 26); });   // pil rundt
  icon('ic_home', () => { g.fillStyle(0xffffff); g.fillTriangle(32, 4, 2, 30, 62, 30); Q(g, 10, 28, 44, 32, 0xffffff); Q(g, 26, 40, 12, 20, 0x2c3e50); });   // hus
  g.fillStyle(0xffffff); g.fillRect(0, 0, 20, 20);
  g.generateTexture('piece', 20, 20); g.clear();
  g.lineStyle(5, 0xe74c3c); g.beginPath(); g.moveTo(14, 0); for (let i = 0; i < 8; i++) g.lineTo(i % 2 ? 3 : 25, 4 + i * 5); g.lineTo(14, 44); g.strokePath();   // fjeder (lodret, 28 x 44)
  g.generateTexture('spring', 28, 44); g.clear();

  // --- forhindringer ---
  // kasse
  g.fillStyle(0xc98f4a); g.fillRect(0, 0, 60, 60); g.lineStyle(4, 0x8a5a25); g.strokeRect(2, 2, 56, 56);
  g.beginPath(); g.moveTo(2, 2); g.lineTo(58, 58); g.moveTo(58, 2); g.lineTo(2, 58); g.strokePath();
  g.generateTexture('box', 60, 60); g.clear();
  // træstamme (set fra enden: bark og årringe)
  g.fillStyle(0x6b4423); g.fillCircle(32, 32, 30);
  g.fillStyle(0x5a3a1c); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.fillCircle(32 + Math.cos(a) * 27, 32 + Math.sin(a) * 27, 4); }
  g.fillStyle(0xe8c58f); g.fillCircle(32, 32, 24);
  g.lineStyle(2, 0xc49a5c); [19, 14, 9, 5].forEach(r => g.strokeCircle(32, 32, r));
  g.fillStyle(0xb98451); g.fillCircle(32, 32, 3);
  g.generateTexture('barrel', 64, 64); g.clear();
  // de to halvdele, når saven har været igennem
  const halfLog = (key, dx) => { g.save(); g.translateCanvas(dx, 0); g.fillStyle(0x6b4423); g.fillCircle(32, 32, 30); g.fillStyle(0xe8c58f); g.fillCircle(32, 32, 24); g.lineStyle(2, 0xc49a5c); [19, 14, 9, 5].forEach(r => g.strokeCircle(32, 32, r)); g.restore();
    g.fillStyle(0xf1dcb0); g.fillRect(dx < 0 ? 28 : 0, 2, 4, 60); g.generateTexture(key, 32, 64); g.clear(); };
  halfLog('barrel_l', 0); halfLog('barrel_r', -32);
  // planke og stolpe
  g.fillStyle(0xd9a066); g.fillRect(0, 0, 110, 16); g.lineStyle(3, 0xa06a30); g.strokeRect(1, 1, 108, 14);
  g.generateTexture('plank', 110, 16); g.clear();
  g.fillStyle(0xb07d3e); g.fillRect(0, 0, 16, 80);
  g.generateTexture('post', 16, 80); g.clear();
  // lagkage
  g.fillStyle(0xf78fb3); g.fillRoundedRect(0, 50, 120, 40, 6); g.fillStyle(0xfff0f5); g.fillRect(0, 50, 120, 8);
  g.fillStyle(0xf78fb3); g.fillRoundedRect(15, 22, 90, 34, 6); g.fillStyle(0xfff0f5); g.fillRect(15, 22, 90, 8);
  g.fillStyle(0xfff0f5); [10, 40, 70, 100].forEach(x => g.fillCircle(x + 5, 56, 7)); [22, 52, 82].forEach(x => g.fillCircle(x + 8, 28, 6));
  g.fillStyle(0xe74c3c); g.fillCircle(60, 14, 9); g.lineStyle(3, 0x27ae60); g.beginPath(); g.moveTo(60, 6); g.lineTo(66, 0); g.strokePath();
  g.generateTexture('cake', 120, 90); g.clear();
  // ballon
  g.fillStyle(0xffffff); g.fillEllipse(18, 20, 34, 42); g.fillTriangle(14, 40, 22, 40, 18, 47);
  g.fillStyle(0xffffff, 0.5); g.fillEllipse(11, 13, 9, 13);
  g.generateTexture('balloon', 36, 48); g.clear();
  // trampolin
  g.fillStyle(0x2c3e50); g.fillRect(14, 36, 10, 30); g.fillRect(146, 36, 10, 30);
  g.fillStyle(0x3498db); g.fillRoundedRect(0, 18, 170, 22, 8); g.fillStyle(0x1a1a2e); g.fillRoundedRect(8, 22, 154, 14, 6);
  g.generateTexture('tramp', 170, 66); g.clear();
  // snebold og hat
  g.fillStyle(0xffffff); g.fillCircle(38, 38, 36); g.lineStyle(3, 0xc9dff0); g.strokeCircle(38, 38, 35);
  g.generateTexture('snow', 76, 76); g.clear();
  g.fillStyle(0x222222); g.fillRect(0, 16, 56, 8); g.fillRect(12, 0, 32, 18); g.fillStyle(0xe74c3c); g.fillRect(12, 12, 32, 4);
  g.generateTexture('hat', 56, 24); g.clear();
  // parkeret bil
  g.fillStyle(0x27ae60); g.fillRoundedRect(0, 30, 190, 44, 10); g.fillRoundedRect(40, 0, 104, 40, { tl: 20, tr: 20, bl: 0, br: 0 });
  g.fillStyle(0x1e8449); g.fillRoundedRect(0, 60, 190, 14, { tl: 0, tr: 0, bl: 10, br: 10 });
  g.fillStyle(0xbdefff); g.fillRoundedRect(50, 6, 84, 28, 7); g.fillStyle(0xfff3b0); g.fillRoundedRect(176, 40, 12, 14, 4); g.fillStyle(0xff3b3b); g.fillRoundedRect(2, 40, 10, 14, 4);

// ---------- knap-hjælper ----------
function makeButton(scene, x, y, w, h, label, color, cb, fontSize, icon) {
  fontSize = fontSize || 36;
  const c = scene.add.container(x, y);
  const g = scene.add.graphics();
  const ic = icon ? scene.add.image(-w / 2 + h * 0.55, 0, icon).setDisplaySize(h * 0.72, h * 0.72) : null;
  const draw = (col) => {
    g.clear();
    g.fillStyle(0x000000, 0.25); g.fillRoundedRect(-w / 2 + 4, -h / 2 + 6, w, h, 18);
    g.fillStyle(col, 1); g.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    g.lineStyle(5, 0xffffff, 0.9); g.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
  };
  draw(color);
  const t = scene.add.text(ic ? h * 0.3 : 0, 0, label, { fontFamily: FONT, fontSize: fontSize + 'px', color: '#fff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
  c.add(ic ? [g, ic, t] : [g, t]);
  c.setInteractive(new Phaser.Geom.Rectangle(-w / 2, -h / 2, w, h), Phaser.Geom.Rectangle.Contains);
  c.on('pointerdown', (p, lx, ly, ev) => { c.setScale(0.93); ev.stopPropagation(); });
  c.on('pointerup', (p, lx, ly, ev) => { c.setScale(1); ev.stopPropagation(); SFX.init(); SFX.click(); cb(); });
  c.on('pointerout', () => c.setScale(1));
  c.setColor = draw; c.label = t;
  return c;
}

// ---------- rund "hold-knap" til touch-styring ----------
function makeHoldButton(scene, x, y, r, label, color) {
  const c = scene.add.container(x, y).setDepth(50);
  const g = scene.add.graphics();
  g.fillStyle(color, 0.55); g.fillCircle(0, 0, r);
  g.lineStyle(6, 0xffffff, 0.8); g.strokeCircle(0, 0, r);
  const t = scene.add.text(0, 0, label, { fontFamily: FONT, fontSize: '54px', color: '#fff' }).setOrigin(0.5);
  c.add([g, t]);
  c.setInteractive(new Phaser.Geom.Circle(0, 0, r), Phaser.Geom.Circle.Contains);
  c.held = false;
  c.on('pointerdown', (p, lx, ly, ev) => { c.held = true; c.setAlpha(1); ev.stopPropagation(); });
  c.on('pointerup', (p, lx, ly, ev) => { c.held = false; c.setAlpha(0.8); ev.stopPropagation(); });
  c.on('pointerout', () => { c.held = false; c.setAlpha(0.8); });
  c.setAlpha(0.8);
  return c;
}

// =====================================================================
// trold og mumie: står med ryggen til, vender sig om og bliver overraskede lige før bilen når frem – rammes de, flyver de snurrende op og lander rodet med stjerner om hovedet
function surpriseObstacle(s, x, y, key, w, h) {
  const t = s.obsImage(key + '_back', x, y - h / 2 + 2, { shape: { type: 'rectangle', width: w * 0.75, height: h }, isStatic: true });
  const obs = { gos: [t], bodies: [t.body], hardness: 0.2, material: 'wood', done: false };
  const watch = s.add.zone(x, y, 1, 1); watch.turned = false; s.actors.push(watch);
  watch.tick = (sc) => { if (watch.turned || obs.done || !t.active || sc.chassis.x < x - 480) return; watch.turned = true;

const BUILD = { chassis: PARTS.chassis[1], wheels: PARTS.wheels[1], motor: PARTS.motors[1], tool: null };

function partTextureKey(kind, part) { return 'p_' + kind + '_' + part.id; }
// overdelens midte i forhold til undervognens midte (uskaleret). 'full'-biler tegner hele bilen i overdelen, som så dækker undervognen
function topRel(ch) { return ch.full ? -ch.topH / 2 : -(ch.h / 2 + ch.topH / 2); }
// udrykningsblink: positioner i forhold til overdelens midte (uskaleret), så alle visninger kan tegne dem ens
function blinkOffsets(ch) {
  if (!ch.lights) return [];
  const TW = ch.topW || ch.w, TH = ch.topH + (ch.full ? ch.h : 0);   // uden 24-margenen: del-teksturen har ingen margen, og i spillet er midten forskudt tilsvarende
  return ch.lights.map(l => ({ dx: l.x - TW / 2, dy: l.y - TH / 2, c: l.c }));
}
function addBlinks(scene, container, ch, topX, topY, sc) {   // lægger blinkende lys i en container (menu, tyveknægt, værksted)
  blinkOffsets(ch).forEach((b, i) => {
    const img = scene.add.image(topX + b.dx * sc, topY + b.dy * sc, 'blink').setTint(b.c).setScale(sc); container.add(img);
    scene.tweens.add({ targets: img, alpha: 0.15, duration: 260, yoyo: true, repeat: -1, delay: i * 260 });
  });
}

// tegner en samlet bil (statisk) ind i en container ud fra valgte dele – bruges på hovedmenuen
function assembleCar(scene, p, ch, wh, mo, to) {
  const sc0 = ch.scale || 1;
  const oy = wh.upright ? ch.h / 2 + wh.r : Math.max(ch.h / 2 - 2, ch.h / 2 - wh.r + 14);
  const cy = -wh.r - oy - (wh.spring ? 50 : 0);
  const body = scene.add.image(0, cy, 'p_chassis_' + ch.id + '_body'); p.add(body);
  p.add(scene.add.image(ch.topOx || 0, cy + topRel(ch), 'p_chassis_' + ch.id + '_top'));
  addBlinks(scene, p, ch, ch.topOx || 0, cy + topRel(ch), 1);
  if (ch.dangle) { const d = scene.add.image(ch.dangle.ox, cy + ch.dangle.oy + ch.dangle.h / 2, 'p_chassis_' + ch.id + '_dangle'); p.add(d);
    if (ch.dangle.prop) p.add(scene.add.image(ch.dangle.ox + ch.dangle.prop.ox, d.y + ch.dangle.prop.oy, 'p_chassis_' + ch.id + '_prop')); }
  const xs = wh.r >= 60 ? [-giantHalf(ch, wh.r) / sc0, giantHalf(ch, wh.r) / sc0] : [ch.back, ch.front], wheels = [];
  if (wh.belt) { const bg = scene.add.graphics(); beltPath(bg, xs[0], cy + oy, xs[1], cy + oy, (wh.r + 7) / sc0, 0); p.add(bg); }
  const rs = rearScaleFor(ch, wh);
  xs.forEach((ox, i) => { const k = i === 0 ? rs : 1, dy = -(k - 1) * wh.r / sc0;
    if (wh.spring) p.add(scene.add.image(ox, cy + oy + 22 + dy, 'spring').setScale(1 / sc0, 56 / 44 / sc0));
    const w = scene.add.image(ox, cy + oy + (wh.spring ? 50 : 0) + dy, 'p_wheels_' + wh.id + (wh.belt ? '_one' : '')).setScale(k / sc0); p.add(w); wheels.push(w);
  });
  const ms = ch.motorScale || 1;
  if (mo.rear) { const rp = rearMotorPos(ch, mo); p.addAt(scene.add.image(rp.x, cy + rp.y, 'rm_' + mo.id).setScale(rmS(mo)), 0); }
  else { const mp = motorPlace(ch, mo); p.add(scene.add.image(-ch.w / 2 + mp.x + 31 * mp.s, cy - ch.h / 2 - ch.topH + mp.y + 11 * mp.s, 'p_motors_' + mo.id).setScale(mp.s)); }
  if (to) {
    const mount = Math.max(ch.w / 2 - 6 + (ch.toolOffset || 0), wh.r >= 60 ? (giantHalf(ch, wh.r) + wh.r + 2) / sc0 : 0);

// bag-motorer (jet/raket): hvor de sidder, i bilens egne (uskalerede) koordinater i forhold til undervognens midte
const RM_SCALE = 0.85;   // standardstørrelse i forhold til tegningen (uskaleret); motorer kan have deres egen (rmScale)
function rmS(mo) { return (mo && mo.rmScale) || RM_SCALE; }
// hvor motoren tegnes i overdelen: øverste venstre hjørne af motorens 60x44-felt og skala. Alle motorer lidt større (1.2), V8 ekstra.
// Optræksnøglen sidder ikke på hjelmen men midt på taget (ch.roof = toppunkt over føreren)
const MOTOR_GROW = 1.2;
function motorPlace(ch, mo) {
  if (mo.roofKey) { const r = ch.roof || [ch.w / 2, 20], s = 0.72; return { x: r[0] - 30 * s, y: r[1] - 44 * s + 3, s }; }
  const s0 = ch.motorScale || 1, s = s0 * MOTOR_GROW * (mo.grow || 1), cx = ch.motorX + 30 * s0, by = ch.motorY + 44 * s0;
  return { x: cx - 30 * s, y: by - 44 * s, s };
}
// kæmpehjul: hjulet stikker kun lidt ud over bilens ende, og der holdes luft mellem de to hjul på korte biler (spil-pixels, fra midten)
function giantHalf(ch, r) { return Math.max(ch.w * (ch.scale || 1) / 2 - r * 0.6, r + 16); }
function rearMotorPos(ch, mo) { const ry = ch.rearY !== undefined ? ch.rearY : ch.topH + ch.h / 2 - 15, S = rmS(mo), W = (mo && mo.rmW) || 66;
  return { x: -ch.w / 2 + 4 - (W - 34) * S, y: ry - ch.topH - ch.h / 2 }; }   // motorens forende rører bilens bagende

// stort baghjul (traktor) – ikke på larvefødder, rulleskøjter og kæmpehjul, hvor det ikke giver mening
function rearScaleFor(ch, wh) { return ch && ch.bigRear && wh && !wh.belt && !wh.upright && wh.r < 60 ? ch.bigRear : 1; }

// larvefødder: bælte om to hjul (bagerst b, forrest f) med radius R – to lige stykker, to buer og trædeklodser forskudt med phase
function beltPath(g, bx, by, fx, fy, R, phase) {
  const dx = fx - bx, dy = fy - by, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, px = uy, py = -ux, a0 = Math.atan2(py, px);
  g.lineStyle(13, 0x2c3e50); g.beginPath();
  g.moveTo(bx + px * R, by + py * R); g.lineTo(fx + px * R, fy + py * R);
  g.arc(fx, fy, R, a0, a0 + Math.PI, false);
  g.lineTo(bx - px * R, by - py * R);
  g.arc(bx, by, R, a0 + Math.PI, a0 + 2 * Math.PI, false);
  g.closePath(); g.strokePath();
  g.lineStyle(3, 0x7f8c8d); g.strokePath();
  const per = 2 * L + 2 * Math.PI * R, step = 16, off = ((phase % step) + step) % step;
  g.fillStyle(0x95a5a6);
  for (let d = off; d < per; d += step) {
    let x, y;
    if (d < L) { x = bx + ux * d + px * R; y = by + uy * d + py * R; }
    else if (d < L + Math.PI * R) { const a = a0 + (d - L) / R; x = fx + Math.cos(a) * R; y = fy + Math.sin(a) * R; }
    else if (d < 2 * L + Math.PI * R) { const t = d - L - Math.PI * R; x = fx - ux * t - px * R; y = fy - uy * t - py * R; }
    else { const a = a0 + Math.PI + (d - 2 * L - Math.PI * R) / R; x = bx + Math.cos(a) * R; y = by + Math.sin(a) * R; }
    g.fillRect(x - 3, y - 3, 6, 6);
  }
}
// laver teksturer for alle dele til tyveknægten (én gang)
function makePartTextures(s) {
  if (s.textures.exists('p_chassis_racer')) return;
  const g = s.add.graphics();
  PARTS.chassis.forEach(p => {   // hel bil-silhuet: overdel + kasse
    const pad = p.full ? 4 : 0;   // luft til kanten på hele biler, så omridset ikke klippes (midten flytter sig ikke)
    g.save(); g.translateCanvas(pad, 0); p.top(g); g.restore(); g.generateTexture('p_chassis_' + p.id + '_top', (p.topW || p.w) + pad * 2, p.topH + (p.full ? p.h : 0)); g.clear();
    if (p.dangle) { p.dangle.draw(g); g.generateTexture('p_chassis_' + p.id + '_dangle', p.dangle.w, p.dangle.h); g.clear(); if (p.dangle.prop) { p.dangle.prop.draw(g); g.generateTexture('p_chassis_' + p.id + '_prop', 28, 28); g.clear(); } }
    p.body(g); g.generateTexture('p_chassis_' + p.id + '_body', p.w, p.h); g.clear();
  });
  PARTS.wheels.forEach(p => { const m = p.shape === 'triangle' ? p.r * 0.5 : (p.upright ? 12 : 0); g.save(); g.translateCanvas(m, m); p.draw(g, p.r); g.restore(); g.generateTexture('p_wheels_' + p.id + (p.belt ? '_one' : ''), p.r * 2 + 4 + m * 2, p.r * 2 + 4 + m * 2); g.clear();
    if (p.belt) {   // i vinduet vises hele larvefoden: to hjul med bælte
      const R = p.r + 7, gap = 84, cx = R + 8 + gap / 2, cy = R + 8;
      beltPath(g, cx - gap / 2, cy, cx + gap / 2, cy, R, 0);
      [cx - gap / 2, cx + gap / 2].forEach(x => { g.save(); g.translateCanvas(x - p.r - 2, cy - p.r - 2); p.draw(g, p.r); g.restore(); });
      g.generateTexture('p_wheels_' + p.id, 2 * R + 16 + gap, 2 * R + 16); g.clear();
    } });
  PARTS.motors.forEach(p => { p.draw(g, 2, 24); g.generateTexture('p_motors_' + p.id, 66, 70); g.clear(); if (p.rear) { p.draw(g, 1, 0); g.generateTexture('rm_' + p.id, 68, 42); g.clear(); } });
  PARTS.tools.forEach(p => { p.draw(g); g.generateTexture('p_tools_' + p.id, p.w, p.h); g.clear(); if (p.drawSpin) { p.drawSpin(g); g.generateTexture('p_tools_' + p.id + '_spin', p.h, p.h); g.clear(); } });
  g.destroy();
}
// laver teksturerne til den byggede bil (overdel inkl. motor)
function makeVehicleTextures(s) {
  const ch = BUILD.chassis, mo = BUILD.motor, wh = BUILD.wheels, to = BUILD.tool;
  ['v_body', 'v_top', 'v_wheel', 'v_tool', 'v_tool1', 'v_tool2', 'v_spin', 'v_head', 'v_head_open', 'v_dangle', 'v_prop'].forEach(k => { if (s.textures.exists(k)) s.textures.remove(k); });
  const g = s.add.graphics();
  ch.body(g); g.generateTexture('v_body', ch.w, ch.h); g.clear();
  const topH = ch.topH + 24 + (ch.full ? ch.h : 0);   // plads til skorstene over motoren
  const pad = ch.full ? 4 : 0;
  for (let f = 0; f < (mo.rear ? 1 : (mo.frames || 1)); f++) {   // animerede motorer: ét billede af overdelen pr. motor-billede
    const key = f ? 'v_top' + f : 'v_top'; if (s.textures.exists(key)) s.textures.remove(key);
    g.save(); g.translateCanvas(pad, 24); ch.top(g);
    if (!mo.rear) { const mp = motorPlace(ch, mo); g.translateCanvas(mp.x, mp.y); g.scaleCanvas(mp.s, mp.s); mo.draw(g, 0, 0, f); }   // jet/raket sidder bagpå som egen del
    g.restore();
    g.generateTexture(key, (ch.topW || ch.w) + pad * 2, topH); g.clear();
  }
  if (ch.dangle) { ch.dangle.draw(g); g.generateTexture('v_dangle', ch.dangle.w, ch.dangle.h); g.clear(); if (ch.dangle.prop) { ch.dangle.prop.draw(g); g.generateTexture('v_prop', 28, 28); g.clear(); } }
  const wr = wh.r;
  const wm = wh.shape === 'triangle' ? wr * 0.5 : (wh.upright ? 12 : 0);
  g.save(); g.translateCanvas(wm, wm); wh.draw(g, wr); g.restore(); g.generateTexture('v_wheel', wr * 2 + 4 + wm * 2, wr * 2 + 4 + wm * 2); g.clear();
  if (to) {
    const bw = to.base ? to.base.w : to.w, bh = to.base ? to.base.h : to.h;
    (to.drawBase || to.draw).call(to, g, 0); g.generateTexture('v_tool', bw, bh); g.clear();
    for (let f = 1; f < (to.frames || 1); f++) { to.draw(g, f); g.generateTexture('v_tool' + f, bw, bh); g.clear(); }
    if (to.drawSpin) { to.drawSpin(g); g.generateTexture('v_spin', to.h, to.h); g.clear(); }
    if (to.head) { to.drawHead(g); g.generateTexture('v_head', to.head.w, to.head.h); g.clear(); if (to.drawOpen) { to.drawOpen(g); g.generateTexture('v_head_open', to.head.w + 6, to.head.h + 6); g.clear(); } }
  }
  g.destroy();
  return topH;
}
// fysikværdier ud fra delene
function vehicleFromBuild() {
  const ch = BUILD.chassis, wh = BUILD.wheels, mo = BUILD.motor, to = BUILD.tool, sc = ch.scale || 1;
  const w = ch.w * sc, h = ch.h * sc;

    this.skyA.setAlpha(1 - t).setVisible(!!sa && t < 1); this.skyB.setAlpha(t).setVisible(!!sb && t > 0);

  updateWeather(delta, scrollX) {   // sne, blade, sand, glimmer eller ildfluer – i spare-tilstand kun hver tredje

  }
  spawnMid(scrollX, carX) {   // mellemlaget: ting med 45 % parallax, placeret i tilfældig størrelse og afstand, så rækken aldrig gentager sig

  // ---------- køretøj ----------

    // traktoren: baghjulet er større, og det løftes, så begge hjul rører jorden samtidig
    this.rearScale = rearScaleFor(BUILD.chassis, BUILD.wheels); this.rearDy = -(this.rearScale - 1) * V.wheel.r;
    const mk = (ox, k) => this.matter.add.image(x + ox, y + V.wheel.oy + (BUILD.wheels.spring ? 50 : 0) + (k > 1 ? this.rearDy : 0), 'v_wheel', null, {

      if (BUILD.wheels.spring) {

        [-26, 26].forEach(dx => this.constraints.push(this.matter.add.constraint(this.chassis.body, w.body, len, 0.08, { pointA: { x: ox + dx, y: V.wheel.oy - 6 + wy }, damping: 0.012 })));
        this.constraints.push(this.matter.add.constraint(this.chassis.body, w.body, drop, 0.15, { pointA: { x: ox, y: V.wheel.oy - 6 + wy }, damping: 0.015 }));   // blødt og wobbly
        this.springs.push({ img: this.add.image(w.x, w.y, 'spring').setDepth(9), ox, oy: V.wheel.oy - 6 + wy, wheel: w });
      } else this.constraints.push(this.matter.add.constraint(this.chassis.body, w.body, 0, 0.85, { pointA: { x: ox, y: V.wheel.oy + wy }, damping: 0.05 }));
    });

      }).setDepth(11).setScale(sc);
      this.constraints.push(this.matter.add.constraint(this.chassis.body, this.dangle.body, 0, 0.9, { pointA: { x: d.ox, y: d.oy }, pointB: { x: 0, y: -d.h / 2 * sc } }));
      this.constraints.push(this.matter.add.constraint(this.chassis.body, this.dangle.body, 0, 0.012, { pointA: { x: d.ox, y: d.oy + d.h * sc }, pointB: { x: 0, y: d.h / 2 * sc }, damping: 0.05 }));   // blød returfjeder: hængslet alene lader Matter dreje delen bagud, når bilen kører
      this.prop = V.chassis.dangle.prop ? this.add.image(0, 0, 'v_prop').setDepth(11).setScale(sc) : null;
    }

    // værktøj foran

    if (V.tool) {
      const t = V.tool, bw = t.base ? t.base.w : t.w, bh = t.base ? t.base.h : t.h;
      const mountX = Math.max(V.chassis.w / 2 - 6 + V.chassis.toolOffset, V.wheel.front + V.wheel.r + 2);   // foran forhjulet (og foran gravkoens arm), også når det er et kæmpehjul

      }).setDepth(12);
      [-6, 6].forEach(dy => this.constraints.push(this.matter.add.constraint(this.chassis.body, this.tool.body, 0, 1, { pointA: { x: mountX, y: t.oy + dy }, pointB: { x: -bw / 2, y: dy } })));
      if (mountX > V.chassis.w / 2) {   // en bjælke fra bilen ud til værktøjet
        this.toolBeam = this.add.image(0, 0, 'slab').setDisplaySize(mountX - V.chassis.w / 2 + 12, 10).setTint(0x7f8c8d).setDepth(9);
        this.toolBeamOff = { x: (V.chassis.w / 2 + mountX) / 2, y: t.oy };
      }

        this.blade = this.add.image(x + tx + t.spinAt.x, y + t.oy + t.spinAt.y, 'v_spin').setDepth(13);
        this.bladeBody = this.matter.add.circle(x + tx + t.spinAt.x, y + t.oy + t.spinAt.y, 34, { density: 0.0004, friction: 0.6, frictionStatic: 1, restitution: 0.05, collisionFilter: filter, label: 'tool' });
        this.constraints.push(this.matter.add.constraint(this.tool.body, this.bladeBody, 0, 1, { pointA: { x: t.spinAt.x, y: t.spinAt.y }, pointB: { x: 0, y: 0 } }));
      }
      this.head = null; this.armG = null; this.toolT0 = 0; this.punchT = 0; this.lastPunchAt = 0; this.toolFrame = 0; this.toolFrameAcc = 0;
      if (t.head && t.head.anim === 'shark') {

        this.head = this.matter.add.image(x + tx + h.rodLen * 0.8, y + t.oy - h.rodLen * 0.5 + h.lineLen, 'v_head', null, {
          shape: { type: 'rectangle', width: h.w, height: h.h }, density: 0.0006, friction: 0.2, frictionAir: 0.04, collisionFilter: { group: GRP_CAR, category: 1, mask: 0xFFFFFFFD }, label: 'tool'
        }).setDepth(15);

        this.constraints.push(this.matter.add.constraint(this.chassis.body, this.head.body, h.lineLen, 0.9, { pointA: { x: this.rodTip.x, y: this.rodTip.y }, pointB: { x: 0, y: -h.h / 2 } }));   // kopi: motoren roterer punktet med bilen

        }).setDepth(t.head.anim === 'sway' || t.head.anim === 'scrub' ? 11 : 13);

  // ---------- sammenstød og skade ----------
  hitImpact(p) {
    const a = p.bodyA, b = p.bodyB, n = p.collision.normal;
    return Math.abs((a.velocity.x - b.velocity.x) * n.x + (a.velocity.y - b.velocity.y) * n.y);
  }

  handleHit(p) {
    const a = p.bodyA, b = p.bodyB;
    const isV = (x) => x.label === 'chassis' || x.label === 'wheel' || x.label === 'tool';
    // skrøbelige ting reagerer på alt, der rammer dem med fart (fx noget bilen skubber foran sig)
    if (!isV(a) && !isV(b) && ((a.obs && a.obs.fragile) || (b.obs && b.obs.fragile))) {
      const imp = this.hitImpact(p);
      if (imp > 2) {
        if (a.obs && a.obs.fragile && !b.isStatic) this.deferred.push(() => a.obs.onHit && a.obs.onHit(imp, null, a));
        if (b.obs && b.obs.fragile && !a.isStatic) this.deferred.push(() => b.obs.onHit && b.obs.onHit(imp, null, b));
      }
      return;
    }
    let part, other;
    if (isV(a) && !isV(b)) { part = a; other = b; } else if (isV(b) && !isV(a)) { part = b; other = a; } else return;
    const imp = this.hitImpact(p), now = this.time.now;
    if (other.label === 'ground') {
      if (part === this.bladeBody) return;   // klingen må gerne rulle på jorden
      if (part.label === 'wheel') {       // hjul mod jord: kun lyd, aldrig skade
        if (imp > 3.5 && now - this.lastLandSnd > 150) { this.lastLandSnd = now; SFX.land(imp / 3); }
      } else if (part.label === 'tool') { if (imp > 4) this.deferred.push(() => this.damage((imp - 4) * 0.6)); }
      else if (imp > 3) this.deferred.push(() => this.damage((imp - 3) * 1.6));
      return;
    }
    const obs = other.obs;
    if (!obs) return;
    // at lande oven på noget med hjulene koster lidt, at køre ind i det koster mere, værktøjet beskytter
    const tool = VEHICLE.tool, vertical = Math.abs(p.collision.normal.y) > 0.6;
    const k = part.label === 'wheel' ? (vertical ? 0.25 : 0.7) : (part.label === 'tool' ? tool.protect : 1.0);
    const canBreak = part.label === 'tool' && (!obs.material || tool.breaks.includes(obs.material));
    const hitImp = canBreak ? imp * tool.smash : imp;   // værktøj rammer hårdere – men kun på det, det kan ødelægge
    // kroppe må ikke ændres midt i fysik-trinnet, så reaktionen udskydes til update()
    const dmg = obs.hardness > 0 && imp > 3 && now - (obs.lastDmg || 0) > 1500;   // én skade pr. ting pr. 1,5 s (ikke når den skubbes foran bilen)
    if (dmg) obs.lastDmg = now;
    this.deferred.push(() => {
      if (obs.onHit) obs.onHit(hitImp, part, other);
      if (dmg) this.damage((imp - 3) * obs.hardness * 1.6 * k);
      if (part.label === 'tool' && tool.punch && !other.isStatic && imp > 2 && now - (other.lastPunch || 0) > 500) {   // boksehandsken slår ting væk
        other.lastPunch = now; SFX.pow();
        Phaser.Physics.Matter.Matter.Body.setVelocity(other, { x: other.velocity.x + 12, y: other.velocity.y - 6 });
      }
    });
  }

  damage(amount) {
    if (this.broken || this.over) return;
    amount = Math.min(25, amount);
    this.health = Math.max(0, this.health - amount);
    if (amount > 2) { SFX.hit(Math.min(1, amount / 30)); this.cameras.main.shake(120 + amount * 6, 0.002 + amount * 0.0003); }
    if (this.health <= 0) this.breakDown();
  }

  breakDown() {
    this.broken = true;
    SFX.bigCrash();
    this.cameras.main.shake(500, 0.012);
    this.constraints.forEach(c => this.matter.world.removeConstraint(c));
    this.wheels.forEach(w => { w.setVelocity(w.body.velocity.x + Phaser.Math.Between(-4, 4), -7); w.setAngularVelocity(Phaser.Math.FloatBetween(-0.4, 0.4)); });
    this.chassis.setVelocityY(-5); this.chassis.setAngularVelocity(0.08);
    this.tweens.add({ targets: this.top, y: this.top.y - 220, x: this.top.x - 120, angle: -300, duration: 900, ease: 'Quad.out' });
    this.tweens.add({ targets: this.top, y: this.top.y + 500, delay: 900, duration: 900, ease: 'Quad.in' });
    for (let i = 0; i < 12; i++) this.spawnPieces(this.chassis.x, this.chassis.y, i % 2 ? 0xe74c3c : 0xf1c40f, 1, 16, 7);
    if (this.rearMotor) this.tweens.add({ targets: this.rearMotor.img, y: '-=200', x: '-=160', angle: -500, alpha: 0, duration: 1300 });
    if (this.blade) { if (this.bladeBody) { this.matter.world.remove(this.bladeBody); this.bladeBody = null; } this.tweens.add({ targets: this.blade, y: '-=300', x: '+=200', angle: 900, alpha: 0, duration: 1500 }); }
    if (this.armG) this.armG.clear();
    setTimeout(() => this.endRound(false, 'Bilen gik i stykker!'), 1700);
  }

  // ---------- forhindringer ----------
  groundY(x) {
    const pts = this.t.pts;
    for (let i = 1; i < pts.length; i++) if (pts[i].x >= x) {
      const a = pts[i - 1], b = pts[i], f = (x - a.x) / (b.x - a.x);
      return a.y + (b.y - a.y) * f;
    }
    return this.t.y;
  }

  slopeAt(x) { return Math.atan2(this.groundY(x + 40) - this.groundY(x - 40), 80); }

  spawnObstacles(untilX) {
    while (this.nextObsX < untilX) {
      let x = this.nextObsX;
      const d = Phaser.Math.Clamp((x - 1500) / 12000, 0, 1);
      // let ved start, hårdere længere ude
      const bm = this.biomeAt(x), bname = bm.t < 0.5 ? bm.nameA : bm.nameB;
      const pool = OBSTACLES.filter(o => o.minD <= d && (!o.biome || o.biome === bname));
      const total = pool.reduce((a, o) => a + o.w, 0);
      let r = Math.random() * total, pick = pool[0];
      for (const o of pool) { r -= o.w; if (r <= 0) { pick = o; break; } }
      if (pick.flat) {                       // stablede ting: fladeste sted i nærheden
        let best = x, bestS = 1e9;
        for (let cx = x - 150; cx <= x + 150; cx += 30) { const sl = Math.abs(this.groundY(cx + 70) - this.groundY(cx - 70)); if (sl < bestS) { bestS = sl; best = cx; } }
        x = best;
      }
      const obs = pick.make(this, x, this.groundY(x));
      if (obs) { obs.x = x; obs.bodies.forEach(b => b.obs = obs); this.obstacles.push(obs); }
      this.nextObsX = x + 550 + Math.random() * 700 - d * 150;
    }
  }

  trimObstacles(behindX) {
    this.obstacles = this.obstacles.filter(o => { if (o.x < behindX) { o.gos.forEach(g => g.destroy()); o.bodies.forEach(b => { if (!b.gameObject) this.matter.world.remove(b); }); return false; } return true; });
    this.actors = this.actors.filter(a => { if (a.x < behindX) { a.destroy(); return false; } return true; });
  }

  spawnUfo(cow, x, y, cr) {   // ufoen daler ned over væsenet og begynder at hive det op i en lysstråle – ram ufoen, så styrter den og væsenet er reddet
    const s = this, hoverY = y - 200;
    const ufo = s.add.image(x, y - 520, 'ufo').setDepth(9);
    const beam = s.add.graphics().setDepth(5);

    const B = Phaser.Physics.Matter.Matter.Body;

      const bx = this.rodTip.x - h.rodLen * 0.8;
      const p0 = cw(bx, t.oy + 8), p1 = cw(bx + h.rodLen * 0.3, t.oy - h.rodLen * 0.6), p2 = cw(this.rodTip.x, this.rodTip.y);

      else { ang = 0.5; if (this.hammerDown) { this.hammerDown = false; SFX.hit(0.25); this.cameras.main.shake(60, 0.002); } }
      const px = -bw / 2 + h.pivot.x, py = h.pivot.y;

        const near = this.obstacles.some(o => o.bodies.some(b => Math.abs(b.position.x - fx) < h.reach * 0.8 && Math.abs(b.position.y - fy) < 70));

      lx = bw / 2 + h.w / 2 - 6 + ext * h.reach;
      // saksearm
      const n = 4, x0 = bw / 2 - 4, x1 = lx - h.w / 2 + 6, segW = (x1 - x0) / n, amp = Math.max(6, 22 * (1 - ext));
      this.armG.lineStyle(5, 0x7f8c8d);
      for (let i = 0; i < n; i++) { const pa = world(x0 + i * segW, i % 2 ? amp : -amp), pb = world(x0 + (i + 1) * segW, i % 2 ? -amp : amp); this.armG.beginPath(); this.armG.moveTo(pa.x, pa.y); this.armG.lineTo(pb.x, pb.y); this.armG.strokePath();
        const pc = world(x0 + i * segW, i % 2 ? -amp : amp), pd = world(x0 + (i + 1) * segW, i % 2 ? amp : -amp); this.armG.beginPath(); this.armG.moveTo(pc.x, pc.y); this.armG.lineTo(pd.x, pd.y); this.armG.strokePath(); }
    } else if (h.anim === 'sway') {

      const px = bw / 2 - 2, py = h.pivot.y;

  }

  stepPhysics(delta) {   // fysikken kører altid i skridt på 1/60 s, uanset om skærmen viser 60, 90 eller 120 billeder i sekundet
    const STEP = 1000 / 60, k = Math.round(delta / STEP);
    if (k >= 1 && Math.abs(delta - k * STEP) < STEP * 0.25) delta = k * STEP;   // små udsving i billedtiden rundes væk, så det ikke hakker
    this.physAcc = Math.min((this.physAcc || 0) + delta, STEP * 2);
    while (this.physAcc >= STEP - 0.001) { this.matter.world.step(STEP); this.physAcc -= STEP; }
  }

  update(time, delta) {
    this.stepPhysics(delta);
    if (this.deferred.length) { const q = this.deferred; this.deferred = []; q.forEach(f => f()); }
    if (this.over) return;
    const c = this.chassis, V = VEHICLE;

    // styring
    let throttle = 0, tilt = 0;
    if (this.broken) throttle = 0;
    else if (this.auto) throttle = 1;
    else {
      const ui = this.ui;
      const right = this.cursors.right.isDown || this.keys.D.isDown || (ui && ui.btnR.held);
      const left  = this.cursors.left.isDown  || this.keys.A.isDown || (ui && ui.btnL.held);
      if (right) throttle = 1; else if (left) throttle = -1;
      tilt = throttle;
    }
    if (!this.broken && (Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.keys.W) || Phaser.Input.Keyboard.JustDown(this.keys.SPACE))) this.tryJump();

    const sawing = !!this.bladeBody && this.time.now - (this.sawingAt || 0) < 250;   // saven bider: motoren slipper, så bilen ikke kravler op over stammen
    if (sawing) {   // saven bider sig fast: bilen kryber ganske langsomt frem, løfter ikke næsen og tæller ikke som 'sidder fast'
      throttle = 0; this.progressTime = this.time.now;
      const Bd = Phaser.Physics.Matter.Matter.Body;
      [c.body, ...this.wheels.map(w => w.body)].forEach(b => { Bd.setVelocity(b, { x: 0.3, y: Math.max(b.velocity.y, 0) }); Bd.setAngularVelocity(b, 0); });
      c.setAwake(); this.wheels.forEach(w => w.setAwake());
    }
    const target = throttle * V.motor.power;
    if (throttle !== 0) {
      this.chassis.setAwake();
      if (V.motor.thrust) {   // raket/jet: skubber i den retning bilen peger, også i luften – og baglæns hvis den er vendt
        const a = c.rotation, f = V.motor.thrust * V.mass * throttle * (c.y < GROUND_Y - 1100 ? 0 : 1);   // ikke højere end et par skærme op
        this.chassis.applyForce({ x: Math.cos(a) * f, y: Math.sin(a) * f });
        if (Math.abs(c.body.velocity.x) > 14) c.setVelocityX(Math.sign(c.body.velocity.x) * 14);
        this.flameAcc = (this.flameAcc || 0) + delta;
        if (this.flameAcc > 40) { this.flameAcc = 0; this.spawnFlame(); }
        this.wheels.forEach(w => w.setAwake());
      } else this.wheels.forEach(w => { w.setAwake(); w.setAngularVelocity(Phaser.Math.Linear(w.body.angularVelocity, target / (w.rk || 1), V.motor.accel)); });
    }
    if (tilt !== 0 && !this.grounded()) c.setAngularVelocity(Phaser.Math.Clamp(c.body.angularVelocity + tilt * 0.004, -0.12, 0.12));   // vip i luften
    // hjælpende hånd: står bilen skævt med hjul på jorden, trækkes den blidt mod vandret
    if (!this.broken && this.grounded()) {
      const tiltA = Phaser.Math.Angle.Wrap(c.rotation);
      if (Math.abs(tiltA) > 0.5 && Math.abs(tiltA) < 2.3) c.setAngularVelocity(c.body.angularVelocity - Math.sign(tiltA) * 0.006);
    }

    // overdel følger chassis (indtil den ryger af)
    if (!this.broken) {
      const a = c.rotation, ox = this.topOx, oy = this.topOy;
      this.top.setPosition(c.x + ox * Math.cos(a) - oy * Math.sin(a), c.y + ox * Math.sin(a) + oy * Math.cos(a));
      this.top.setRotation(a);
      if (V.motor.frames) {   // motoren kører: hurtigere når der gives gas
        const n = V.motor.frames; this.motorPh = ((this.motorPh || 0) + delta * (throttle !== 0 ? 0.014 + Math.min(1, Math.abs(c.body.velocity.x) / 11) * 0.012 : 0.006)) % n;
        const fi = this.motorPh | 0; if (fi !== this.motorFi) { this.motorFi = fi; this.top.setTexture(fi ? 'v_top' + fi : 'v_top'); }
      }
      if (this.rearMotor) { const r = this.rearMotor; r.img.setPosition(c.x + r.lx * Math.cos(a) - r.ly * Math.sin(a), c.y + r.lx * Math.sin(a) + r.ly * Math.cos(a)).setRotation(a); }
      this.blinks.forEach(b => b.img.setPosition(c.x + b.lx * Math.cos(a) - b.ly * Math.sin(a), c.y + b.lx * Math.sin(a) + b.ly * Math.cos(a)));
    } else this.blinks.forEach(b => b.img.setVisible(false));
    if (this.tool && !this.broken) this.animateTool(time, delta, throttle !== 0 || Math.abs(c.body.velocity.x) > 1);
    this.wheelSkins.forEach((sk, i) => sk.setPosition(this.wheels[i].x, this.wheels[i].y));
    if (this.belt) this.drawBelt();
    if (this.prop && this.dangle) {   // skruen sidder nederst på påhængsmotoren og snurrer, når bilen kører
      const d = this.dangle, a = d.rotation, po = V.chassis.dangle.prop;
      this.prop.setPosition(d.x + po.ox * Math.cos(a) - po.oy * Math.sin(a), d.y + po.ox * Math.sin(a) + po.oy * Math.cos(a)).setRotation(a).setVisible(!this.broken);
      const spin = Math.abs(c.body.velocity.x) > 0.5 || throttle !== 0;
      this.prop.scaleY = V.chassis.scale * (spin ? 0.25 + Math.abs(Math.sin(time / 45)) * 0.75 : 1);
    }
    this.springs.forEach(sp => {   // fjedrene tegnes mellem bilen og hjulet
      const a = c.rotation, ax = c.x + sp.ox * Math.cos(a) - sp.oy * Math.sin(a), ay = c.y + sp.ox * Math.sin(a) + sp.oy * Math.cos(a);
      const dx = sp.wheel.x - ax, dy = sp.wheel.y - ay, d = Math.hypot(dx, dy);
      sp.img.setPosition((ax + sp.wheel.x) / 2, (ay + sp.wheel.y) / 2).setRotation(Math.atan2(dy, dx) - Math.PI / 2).setScale(1, Math.max(0.3, d / 44)).setVisible(!this.broken);
    });
    if (this.toolBeam && !this.broken) { const a = c.rotation, o = this.toolBeamOff; this.toolBeam.setPosition(c.x + o.x * Math.cos(a) - o.y * Math.sin(a), c.y + o.x * Math.sin(a) + o.y * Math.cos(a)).setRotation(a); }
    if (this.blade && this.tool && this.bladeBody) {   // savklingen følger sin krop og snurrer (og driver bilen frem, hvis den rører jorden)
      const B = Phaser.Physics.Matter.Matter.Body, bb = this.bladeBody, spinning = !this.broken && (throttle !== 0 || Math.abs(c.body.velocity.x) > 1 || sawing);   // også mens den saver (hvor bilen står næsten stille)
      if (spinning && !sawing) B.setAngularVelocity(bb, 0.45);   // mens den saver, går den langsommere og kravler ikke op over stammen
      if (sawing && c.body.velocity.x > 0.6) { B.setVelocity(c.body, { x: 0.6, y: c.body.velocity.y }); this.wheels.forEach(w => B.setVelocity(w.body, { x: 0.6, y: w.body.velocity.y })); }
      this.blade.setPosition(bb.position.x, bb.position.y).setRotation(bb.angle);
      this.bladeSpinning = spinning;
    }
    const g = this.grounded();

    // lyd og røg
    const speed = Phaser.Math.Clamp(Math.abs(c.body.velocity.x) / 11, 0, 1);
    if (SFX.ctx && !SFX.eng) SFX.startEngine();
    SFX.engine(speed, throttle !== 0);
    this.smokeAcc += delta * (throttle !== 0 ? 1 + speed : 0.3) * (this.health > 50 ? 1 : (this.health > 25 ? 2 : 3.5));
    if (this.smokeAcc > 160) { this.smokeAcc = 0; this.spawnSmoke(); }

    // terræn og forhindringer
    // måler billedtiden: hakker det i flere sekunder, går vi i let tilstand (færre lag og mindre pynt)
    this.frameAvg = (this.frameAvg || 16.7) * 0.95 + Math.min(delta, 100) * 0.05;
    if (!this.lite && this.frameAvg > 24 && time - this.startTime > 4000) { this.slowSince = this.slowSince || time; if (time - this.slowSince > 2500) this.setLite(true); } else if (this.frameAvg < 20) this.slowSince = 0;
    if (this.ui && this.ui.fpsText && (time | 0) % 10 === 0) this.ui.fpsText.setText((1000 / this.frameAvg | 0) + ' fps' + (this.lite ? ' (let)' : ''));
    this.extendTerrain(c.x + W * 1.5);
    this.trimTerrain(c.x - W * 1.5);
    this.updateBiome(c.x);
    this.spawnDecor(c.x + W * 1.2);
    this.spawnObstacles(c.x + 1150);        // lige uden for højre skærmkant
    this.trimObstacles(c.x - W * 1.5);
    this.actors.forEach(a => a.tick && a.tick(this, time));
    this.drawTerrain();
    const cam = this.cameras.main;
    // parallax: jo længere væk, jo langsommere – og lagene glider lidt lodret, når bilen flyver op
    const dy = cam.scrollY - (GROUND_Y - 480);   // 0 ved kørsel på flad jord, negativ når kameraet er oppe
    this.hills.tilePositionX = this.hillsB.tilePositionX = cam.scrollX * 0.15; this.hills.y = this.hillsB.y = H - 500 - dy * 0.12;
    this.skyA.tilePositionX = this.skyB.tilePositionX = cam.scrollX * 0.02; this.skyA.y = this.skyB.y = -dy * 0.05; this.sun.y = 120 - dy * 0.05;
    this.spawnMid(cam.scrollX, c.x);
    this.groundBg.y = H - 200 - dy * 0.3;
    this.clouds.tilePositionX = cam.scrollX * 0.04 + time * 0.01; this.clouds.y = -dy * 0.06;
    this.updateWeather(delta, cam.scrollX);
    this.fg.tilePositionX = cam.scrollX * 0.9; this.fg.y = H - 140 - dy * 1.0;
    // forlygter om natten
    if (this.night > 0.02 && !this.broken) {
      if (!this.beamImg) this.beamImg = this.add.image(0, 0, 'headlight').setDepth(9).setOrigin(0, 0.5);
      const a = c.rotation, fx = V.chassis.w / 2, fy = -V.chassis.h * 0.2;
      this.beamImg.setPosition(c.x + fx * Math.cos(a) - fy * Math.sin(a), c.y + fx * Math.sin(a) + fy * Math.cos(a)).setRotation(a + 0.08).setAlpha(this.night * 0.55).setVisible(true);
    } else if (this.beamImg) this.beamImg.setVisible(false);

    // score
    const dist = (c.x - this.startX) / PX_PER_M;
    if (dist > this.maxDist) { this.maxDist = dist; if (this.ui) this.ui.distText.setText(Math.floor(dist) + ' m'); }

    if (this.broken) return;

    // ude af banen: baglæns ud over kanten eller ned i et hul
    if (c.x < this.t.pts[0].x + 100) return this.endRound(false, 'Du fløj ud af banen!');
    if (c.y > 1500) return this.endRound(false, 'Bilen faldt i et hul!');

    // vendt på hovedet?
    const ang = Math.abs(Phaser.Math.Angle.Wrap(c.rotation));
    const chassisDown = time - this.chassisGroundTime < 120;
    if (ang > 2.2 && chassisDown) { if (!this.flipTime) this.flipTime = time; } else this.flipTime = 0;
    if (this.flipTime && time - this.flipTime > 1300) return this.endRound(false, 'Bilen vendte på hovedet!');

    // sidder fast? (er ikke kommet 15 px nogen vej i 4 sekunder)
    if (Math.abs(c.x - this.progressX) > 15) { this.progressX = c.x; this.progressTime = time; }
    if (time - this.progressTime > 4000) return this.endRound(false, 'Bilen sidder fast!');
  }

  endRound(quiet, reason) {
    if (this.over) return;
    this.over = true;
    this.matter.world.pause();
    SFX.stopEngine();
    const dist = Math.floor(this.maxDist);
    const record = dist > 0 && dist > Math.floor(SETTINGS.best);
    if (record) { SETTINGS.best = dist; saveSettings(); }
    if (!quiet) { SFX.crash(); if (record) setTimeout(() => SFX.tada(), 500); }

    if (this.ui) this.ui.showGameOver(dist, record, reason);
    setTimeout(() => {
      if (!this.scene.isActive()) return;
      this.input.keyboard.once('keydown-SPACE', () => this.restartRound());
      this.input.keyboard.once('keydown-ENTER', () => this.restartRound());
    }, 600);
  }

  restartRound() { this.scene.stop('UI'); this.scene.restart(); }
  toBuild()      { this.scene.stop('UI'); this.scene.start('Build'); }
  toMenu()       { this.scene.stop('UI'); this.scene.start('Title'); }
}

// =====================================================================
//  UI – HUD, touch-knapper og slutskærm (egen scene, så kameraet ikke
//  ruller den, og tryk altid rammer)
// =====================================================================
class UI extends Phaser.Scene {
  constructor() { super('UI'); }
  create() {
    const game = this.scene.get('Game');
    game.ui = this;
    this.input.addPointer(3);

    this.distText = this.add.text(20, 16, '0 m', { fontFamily: FONT, fontSize: '48px', color: '#fff', stroke: '#2c3e50', strokeThickness: 8 });
    this.fpsText = this.add.text(8, H - 18, '', { fontFamily: 'Arial', fontSize: '12px', color: '#ffffff', stroke: '#000', strokeThickness: 2 }).setAlpha(0.7);
    this.add.text(22, 72, SETTINGS.best > 0 ? 'Rekord: ' + Math.floor(SETTINGS.best) + ' m' : '', { fontFamily: FONT, fontSize: '22px', color: '#fff', stroke: '#2c3e50', strokeThickness: 5 });
    addCornerButtons(this);
    this.add.text(W / 2 - 232, 36, '🔧', { fontSize: '30px' }).setOrigin(0.5);
    this.hpG = this.add.graphics();
    this.hpShown = 100;

    this.btnL = { held: false }; this.btnR = { held: false };
    if (game.auto) {
      const hint = this.add.text(W / 2, H - 70, 'Tryk for at hoppe!', { fontFamily: FONT, fontSize: '40px', color: '#fff', stroke: '#2c3e50', strokeThickness: 8 }).setOrigin(0.5);
      this.tweens.add({ targets: hint, alpha: 0, delay: 3000, duration: 800 });
      this.input.on('pointerdown', () => game.tryJump());
    } else {
      this.btnL = makeHoldButton(this, 110, H - 110, 70, '◀', 0x2980b9);
      this.btnR = makeHoldButton(this, 290, H - 110, 70, '▶', 0x2980b9);
      this.btnJ = makeHoldButton(this, W - 130, H - 110, 85, '⬆', 0xe67e22);
      this.btnJ.on('pointerdown', () => game.tryJump());
    }
  }

  update() {
    const game = this.scene.get('Game');
    if (!game.chassis) return;
    this.hpShown = Phaser.Math.Linear(this.hpShown, game.health, 0.15);
    const g = this.hpG, x = W / 2 - 200, y = 22, w = 400, h = 28, f = this.hpShown / 100;
    g.clear();
    g.fillStyle(0x000000, 0.35); g.fillRoundedRect(x + 3, y + 4, w, h, 10);
    g.fillStyle(0x2c3e50); g.fillRoundedRect(x, y, w, h, 10);
    const col = f > 0.5 ? 0x2ecc71 : (f > 0.25 ? 0xf1c40f : 0xe74c3c);
    if (f > 0.02) { g.fillStyle(col); g.fillRoundedRect(x + 4, y + 4, (w - 8) * f, h - 8, 7); }
    g.lineStyle(4, 0xffffff, 0.9); g.strokeRoundedRect(x, y, w, h, 10);
  }

  showGameOver(dist, record, reason) {
    const game = this.scene.get('Game');
    this.add.rectangle(0, 0, W, H, 0x000000, 0.45).setOrigin(0).setDepth(70);
    const head = record ? 'NY REKORD!' : (reason || 'Runden er slut');
    this.add.text(W / 2, 200, head, { fontFamily: FONT, fontSize: record ? '80px' : '52px', color: record ? '#ffe066' : '#fff', stroke: '#2c3e50', strokeThickness: 10 }).setOrigin(0.5).setDepth(71);
    this.add.text(W / 2, 300, 'Du kørte ' + dist + ' m', { fontFamily: FONT, fontSize: '56px', color: '#fff', stroke: '#2c3e50', strokeThickness: 8 }).setOrigin(0.5).setDepth(71);
    if (!record && SETTINGS.best > 0) this.add.text(W / 2, 360, 'Rekord: ' + Math.floor(SETTINGS.best) + ' m', { fontFamily: FONT, fontSize: '30px', color: '#fff', stroke: '#2c3e50', strokeThickness: 6 }).setOrigin(0.5).setDepth(71);
    // kort pause, så et "tryk for at hoppe" ikke rammer knappen
    setTimeout(() => {
      if (!this.scene.isActive()) return;
      makeButton(this, W / 2 - 290, 480, 270, 100, 'IGEN!', 0xe67e22, () => game.restartRound(), 40, 'ic_again').setDepth(72);
      makeButton(this, W / 2, 480, 270, 100, 'Ny bil', 0x27ae60, () => game.toBuild(), 38, 'ic_build').setDepth(72);
      makeButton(this, W / 2 + 290, 480, 270, 100, 'Menu', 0x7f8c8d, () => game.toMenu(), 38, 'ic_home').setDepth(72);
    }, 600);
  }
}

// =====================================================================
function startGame() { window.game = new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  parent: document.body,
  backgroundColor: '#7ec8e3',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'matter', matter: { gravity: { y: 1.0 }, runner: { isFixed: true, fps: 60 }, enableSleeping: true, positionIterations: 12, velocityIterations: 8, constraintIterations: 4, debug: false } },
  audio: { noAudio: true },
  scene: [Title, Build, Game, UI]
}); }
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load("700 20px 'Fredoka'"), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(startGame, startGame);
</script>
